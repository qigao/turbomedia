# Public Apple HLS test stream:
# https://developer.apple.com/streaming/examples/
api_version: turbo.media.pipeline/v1
id: public-hls-to-matroska
limits:
  open_timeout_ms: 15000
  io_timeout_ms: 15000
nodes:
  - id: input
    kind: source
    factory: ffmpeg.input
    config:
      url: https://devstreaming-cdn.apple.com/videos/streaming/examples/img_bipbop_adv_example_ts/v2/prog_index.m3u8
  - id: demux
    kind: demux
    factory: ffmpeg.demux
  - id: mux
    kind: mux
    factory: ffmpeg.mux
    config:
      format: matroska
  - id: output
    kind: sink
    factory: ffmpeg.output
    config:
      url: public_bipbop.mkv
edges:
  - from: input.out
    to: demux.in
  - from: demux.video
    to: mux.video
  - from: mux.out
    to: output.in
