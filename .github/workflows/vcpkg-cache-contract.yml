name: TurboMedia vcpkg Cache Contract

on:
  pull_request:
    paths:
      - ".github/workflows/vcpkg-cache-contract.yml"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
      - "vcpkg-overlays/**"
  push:
    branches: [master]
    paths:
      - ".github/workflows/vcpkg-cache-contract.yml"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
      - "vcpkg-overlays/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: turbomedia-media-vcpkg-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux x64 cache
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: readwrite

      - name: Prepare Linux build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config nasm autoconf automake libtool

      - name: Warm Linux media ABI set
        shell: bash
        run: |
          set -euo pipefail
          rm -rf vcpkg_installed "$VCPKG_BINARY_CACHE"
          mkdir -p "$VCPKG_BINARY_CACHE"
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root=. \
            --x-install-root="$GITHUB_WORKSPACE/vcpkg_installed" \
            --triplet x64-linux

  windows:
    name: Windows x64 cache
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: readwrite

      - name: Prepare Windows build tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install ninja nasm strawberryperl -y --no-progress

      - name: Warm Windows media ABI set
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installed = Join-Path $env:GITHUB_WORKSPACE "vcpkg_installed"
          if (Test-Path -LiteralPath $installed) { Remove-Item -LiteralPath $installed -Recurse -Force }
          if (Test-Path -LiteralPath $env:VCPKG_BINARY_CACHE) { Remove-Item -LiteralPath $env:VCPKG_BINARY_CACHE -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $env:VCPKG_BINARY_CACHE | Out-Null
          $args = @("install", "--x-manifest-root=.", "--x-install-root=$installed", "--triplet=x64-windows")
          & "$env:VCPKG_ROOT\vcpkg.exe" @args
          if ($LASTEXITCODE -ne 0) { throw "Windows media cache warm failed" }

  android:
    name: Android arm64-v8a cache
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: readwrite

      - name: Prepare Android build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config nasm autoconf automake libtool
          test -n "${ANDROID_NDK_HOME:-}"
          test -f "$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"

      - name: Warm Android media ABI set
        shell: bash
        run: |
          set -euo pipefail
          rm -rf vcpkg_installed "$VCPKG_BINARY_CACHE"
          mkdir -p "$VCPKG_BINARY_CACHE"
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root=. \
            --x-install-root="$GITHUB_WORKSPACE/vcpkg_installed" \
            --triplet arm64-android-api26

      - name: Verify Android FFmpeg package config
        shell: bash
        run: |
          set -euo pipefail
          contract="$RUNNER_TEMP/turbomedia-ffmpeg-android-contract"
          rm -rf "$contract"
          mkdir -p "$contract"
          cat > "$contract/CMakeLists.txt" <<'EOF'
          cmake_minimum_required(VERSION 3.25)
          project(turbomedia_ffmpeg_android_contract C)
          find_package(FFMPEG REQUIRED)
          if(NOT FFMPEG_LIBRARIES)
            message(FATAL_ERROR "FFMPEG_LIBRARIES is empty")
          endif()
          EOF
          cmake -S "$contract" -B "$contract/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_TARGET_TRIPLET=arm64-android-api26 \
            -DVCPKG_MANIFEST_MODE=OFF \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed" \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DCMAKE_SYSTEM_NAME=Android \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_shared

  macos:
    name: macOS arm64 media cache
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15
    timeout-minutes: 120
    env:
      # Keep TurboMedia's macOS packages in a product-owned NuGet namespace.
      # The legacy unprefixed package IDs are owned by other repositories and
      # reject this repository's GITHUB_TOKEN with 403 on push.
      X_VCPKG_NUGET_ID_PREFIX: turbomedia
    steps:
      - uses: actions/checkout@v4

      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: readwrite

      - name: Prepare macOS build tools
        shell: bash
        run: |
          set -euo pipefail
          brew install ninja nasm autoconf automake autoconf-archive libtool
          test "$(uname -m)" = "arm64"

      - name: Warm macOS media ABI set
        shell: bash
        run: |
          set -euo pipefail
          rm -rf vcpkg_installed "$VCPKG_BINARY_CACHE"
          mkdir -p "$VCPKG_BINARY_CACHE"
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root=. \
            --x-install-root="$GITHUB_WORKSPACE/vcpkg_installed" \
            --triplet arm64-osx

      - name: Verify macOS clean L2 restore
        shell: bash
        run: |
          set -euo pipefail
          installed="$GITHUB_WORKSPACE/vcpkg_installed"
          log="$RUNNER_TEMP/turbomedia-macos-clean-l2.log"
          rm -rf "$installed" "$VCPKG_BINARY_CACHE"
          mkdir -p "$VCPKG_BINARY_CACHE"
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root=. \
            --x-install-root="$installed" \
            --triplet arm64-osx \
            --only-binarycaching 2>&1 | tee "$log"
          grep -Eq 'Restored [1-9][0-9]* package\(s\) from NuGet' "$log"
          if grep -Eq '^Building ' "$log"; then
            echo "macOS clean-L2 verification attempted a source build" >&2
            exit 1
          fi
