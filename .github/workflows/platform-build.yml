name: Platform Build

on:
  pull_request:
    paths:
      - 'cmake/ci/m16-sdk-lock.json'
      - '.github/actions/setup-native-deps/**'
      - ".github/workflows/platform-build.yml"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "CMakeUserPresets.json"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
      - "vcpkg-overlays/**"
      - "vcpkg-triplets/**"
      - "presets/**"
      - "cmake/**"
      - "common/**"
      - "core/**"
      - "streamgraph/**"
      - "crypto/**"
      - "speech/**"
      - "codec/**"
      - "muxer/**"
      - "demuxer/**"
      - "network/**"
      - "transport/**"
      - "tools/**"
      - "vendor/**"
      - "player/**"
      - "client_processing/**"
      - "recognition/**"
      - "media/**"
      - "server/**"
      - "streamer/**"
      - "pipeline/**"
      - "webrtc/**"
      - "examples/**"
      - "tests/**"
  push:
    branches: [master]
    paths:
      - 'cmake/ci/m16-sdk-lock.json'
      - '.github/actions/setup-native-deps/**'
      - ".github/workflows/platform-build.yml"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "CMakeUserPresets.json"
      - "presets/**"
      - "cmake/**"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
      - "vcpkg-overlays/**"
      - "vcpkg-triplets/**"
      - "common/**"
      - "core/**"
      - "streamgraph/**"
      - "crypto/**"
      - "speech/**"
      - "codec/**"
      - "muxer/**"
      - "demuxer/**"
      - "network/**"
      - "transport/**"
      - "tools/**"
      - "vendor/**"
      - "player/**"
      - "client_processing/**"
      - "recognition/**"
      - "media/**"
      - "server/**"
      - "streamer/**"
      - "pipeline/**"
      - "webrtc/**"
      - "examples/**"
      - "tests/**"

permissions:
  contents: read
  packages: read

concurrency:
  group: platform-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      TURBOMEDIA_CI_PLATFORM: ${{ matrix.platform }}
      TURBOMEDIA_CI_TRIPLET: ${{ matrix.triplet }}
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_COMPRESS: "true"
      CCACHE_MAXSIZE: 500M
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-24.04
            rid: linux-x64
            triplet: x64-linux
          - platform: Windows
            os: windows-2022
            rid: windows-x64
            triplet: x64-windows
          - platform: Android
            os: ubuntu-24.04
            rid: android-arm64-v8a
            triplet: arm64-android-api26
          - platform: macOS
            os: macos-15
            rid: macos-arm64
            triplet: arm64-osx

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # Test-only source checkout for the private C11 SCTP conformance harness.
      # The source is compiled only into tests and never linked into production.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: qigao/salts
          # Immutable source checkpoint qualified by the C11 6/6 + Owner TSan run.
          ref: 1ebec510a7928864a74307a98aaa18a310abd0de
          path: salts-sctp-prototype

      - uses: ./.github/actions/setup-native-deps

      - name: Prepare Linux and Android build tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config nasm autoconf automake libtool ccache
          if [ "${{ matrix.platform }}" = "Linux" ]; then
            sudo apt-get install -y --no-install-recommends \
              libpipewire-0.3-dev libx11-dev libxext-dev
          else
            test -n "${ANDROID_NDK_HOME:-}"
            test -f "$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
          fi

      - name: Prepare Windows build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install ninja nasm strawberryperl ccache -y --no-progress
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products "*" -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($vs)) {
            throw "x64 MSVC was not found"
          }
          $canonicalVcpkgRoot = $env:VCPKG_ROOT
          $vsdev = Join-Path $vs "Common7/Tools/VsDevCmd.bat"
          $command = 'call "' + $vsdev + '" -arch=x64 -host_arch=x64 >nul && set'
          $lines = & cmd.exe /d /s /c $command
          if ($LASTEXITCODE -ne 0) { throw "VsDevCmd failed" }
          foreach ($line in $lines) {
            if ($line -match '^([^=]+)=(.*)$') {
              "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }
          "VCPKG_ROOT=$canonicalVcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare macOS build tools
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          brew install ninja nasm autoconf automake libtool ccache

      - name: Restore compiler cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.triplet }}-${{ hashFiles('cmake/ci/m16-sdk-lock.json', 'CMakePresets.json', '.github/workflows/platform-build.yml', 'vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlays/**', 'vcpkg-triplets/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.triplet }}-${{ hashFiles('cmake/ci/m16-sdk-lock.json', 'CMakePresets.json', '.github/workflows/platform-build.yml', 'vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlays/**', 'vcpkg-triplets/**') }}-

      - name: Initialize compiler cache statistics
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & ccache --version
          if ($LASTEXITCODE -ne 0) { throw "ccache is missing" }
          & ccache --zero-stats
          if ($LASTEXITCODE -ne 0) { throw "ccache statistics reset failed" }

      - name: Restore locked platform SDKs with curl
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./cmake/ci/restore-turbomedia-platform-deps.ps1 -Rid "${{ matrix.rid }}"

      - name: Restore media dependencies cache-only
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $installed = Join-Path $env:GITHUB_WORKSPACE "vcpkg_installed"
          python cmake/ci/github_packages.py media --triplet ${{ matrix.triplet }} --installed "$installed"
          if ($LASTEXITCODE -ne 0) { throw "cache-only vcpkg restore failed" }

      - name: Configure
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $build = Join-Path $env:GITHUB_WORKSPACE "build/platform-${{ matrix.platform }}"
          $stage = Join-Path $env:GITHUB_WORKSPACE "stage/platform-${{ matrix.platform }}"
          Remove-Item -LiteralPath $build -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $stage -Recurse -Force -ErrorAction SilentlyContinue
          $args = @(
            "--preset", "ci-platform-release",
            "-DSALTS_SCTP_SOURCE_DIR=$env:GITHUB_WORKSPACE/salts-sctp-prototype/cnet/sctp"
          )
          if ("${{ matrix.platform }}" -eq "Android") {
            $args += @(
              "-DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=$env:ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake",
              "-DCMAKE_SYSTEM_NAME=Android",
              "-DANDROID_ABI=arm64-v8a",
              "-DANDROID_PLATFORM=android-26",
              "-DANDROID_STL=c++_shared"
            )
          }
          if ("${{ matrix.platform }}" -eq "Linux") {
            $args += @("-DTURBO_MEDIA_ENABLE_SALTS_C11_SCTP_TSAN=ON")
          }
          & cmake @args
          if ($LASTEXITCODE -ne 0) { throw "configure failed for ${{ matrix.platform }}" }

      - name: Verify C11 handoff sources are TSan-instrumented
        if: matrix.platform == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          commands = json.loads(Path("build/platform-Linux/compile_commands.json").read_text())
          suffixes = (
              "/webrtc/tests/test_salts_c11_sctp_dtls_handoff.c",
              "/salts-sctp-prototype/cnet/sctp/src/sctp_wire.c",
              "/salts-sctp-prototype/cnet/sctp/src/sctp_init_params.c",
              "/salts-sctp-prototype/cnet/sctp/src/sctp_collision.c",
              "/salts-sctp-prototype/cnet/sctp/src/sctp_data.c",
              "/salts-sctp-prototype/cnet/sctp/src/sctp_assoc.c",
              "/salts-sctp-prototype/cnet/sctp/src/sctp_dcep.c",
              "/salts-sctp-prototype/cnet/sctp/src/sctp_webrtc.c",
          )
          target = "turbo_media_test_salts_c11_sctp_dtls_handoff.dir"
          def verify_target(target, suffixes, sanitizer="-fsanitize=thread"):
              for suffix in suffixes:
                  matches = [
                      item for item in commands
                      if item["file"].replace("\\", "/").endswith(suffix)
                      and target in item.get("command", " ".join(item.get("arguments", ())))
                  ]
                  if len(matches) != 1:
                      raise SystemExit(f"Expected one compile unit for {target} {suffix}, found {len(matches)}")
                  command = matches[0].get("command", " ".join(matches[0].get("arguments", ())))
                  if sanitizer not in command or "-fno-omit-frame-pointer" not in command:
                      raise SystemExit(f"{sanitizer} flags missing from {target} {suffix}")
                  print(f"SANITIZER SOURCE OK {sanitizer} {target} {suffix}")

          verify_target(
              "turbo_media_test_salts_c11_sctp_dtls_handoff.dir",
              (
                  "/webrtc/tests/test_salts_c11_sctp_dtls_handoff.c",
                  "/salts-sctp-prototype/cnet/sctp/src/sctp_wire.c",
                  "/salts-sctp-prototype/cnet/sctp/src/sctp_init_params.c",
                  "/salts-sctp-prototype/cnet/sctp/src/sctp_collision.c",
                  "/salts-sctp-prototype/cnet/sctp/src/sctp_data.c",
                  "/salts-sctp-prototype/cnet/sctp/src/sctp_assoc.c",
                  "/salts-sctp-prototype/cnet/sctp/src/sctp_dcep.c",
                  "/salts-sctp-prototype/cnet/sctp/src/sctp_webrtc.c",
              ),
          )
          verify_target(
              "turbo_media_test_c11_sctp_dtls_records.dir",
              (
                  "/webrtc/tests/test_c11_sctp_dtls_records.c",
                  "/webrtc/src/dc_certificate.cpp",
                  "/salts-sctp-prototype/cnet/sctp/src/sctp_wire.c",
                  "/salts-sctp-prototype/cnet/sctp/src/sctp_init_params.c",
                  "/salts-sctp-prototype/cnet/sctp/src/sctp_collision.c",
                  "/salts-sctp-prototype/cnet/sctp/src/sctp_data.c",
                  "/salts-sctp-prototype/cnet/sctp/src/sctp_assoc.c",
                  "/salts-sctp-prototype/cnet/sctp/src/sctp_dcep.c",
                  "/salts-sctp-prototype/cnet/sctp/src/sctp_webrtc.c",
              ),
          )
          verify_target(
              "turbo_media_test_c11_sctp_peer_bridge.dir",
              (
                  "/webrtc/tests/test_c11_sctp_peer_bridge.c",
                  "/webrtc/src/turbo_datachannel.c",
                  "/webrtc/src/dc_certificate.cpp",
                  "/webrtc/src/turbo_datachannel_errors.c",
                  "/webrtc/src/turbo_dc_msg.c",
                  "/webrtc/src/dcep_protocol.c",
                  "/webrtc/src/dtls_session.c",
                  "/webrtc/src/sctp_session.c",
                  "/webrtc/src/stb_sprintf.c",
                  "/salts-sctp-prototype/cnet/sctp/src/sctp_wire.c",
                  "/salts-sctp-prototype/cnet/sctp/src/sctp_init_params.c",
                  "/salts-sctp-prototype/cnet/sctp/src/sctp_collision.c",
                  "/salts-sctp-prototype/cnet/sctp/src/sctp_data.c",
                  "/salts-sctp-prototype/cnet/sctp/src/sctp_assoc.c",
                  "/salts-sctp-prototype/cnet/sctp/src/sctp_dcep.c",
                  "/salts-sctp-prototype/cnet/sctp/src/sctp_webrtc.c",
                  "/salts-sctp-prototype/cnet/sctp/src/sctp_gmssl_mac.c",
              ),
          )
          verify_target(
              "turbo_media_test_datachannel_peer_destroy_drain.dir",
              (
                  "/webrtc/tests/test_datachannel_peer_destroy_drain.c",
                  "/webrtc/src/turbo_datachannel.c",
                  "/webrtc/src/dc_certificate.cpp",
                  "/webrtc/src/turbo_datachannel_errors.c",
                  "/webrtc/src/turbo_dc_msg.c",
                  "/webrtc/src/dcep_protocol.c",
                  "/webrtc/src/dtls_session.c",
                  "/webrtc/src/sctp_session.c",
                  "/webrtc/src/stb_sprintf.c",
              ),
          )
          verify_target(
              "turbo_media_test_dcep_ack_fault.dir",
              (
                  "/webrtc/tests/test_dcep_ack_fault.c",
              ),
              "-fsanitize=address,undefined",
          )
          verify_target(
              "turbo_media_test_datachannel_channel_leases_asan.dir",
              (
                  "/webrtc/tests/test_datachannel_peer_destroy_drain.c",
                  "/webrtc/src/turbo_datachannel.c",
                  "/webrtc/src/dc_certificate.cpp",
                  "/webrtc/src/turbo_datachannel_errors.c",
                  "/webrtc/src/turbo_dc_msg.c",
                  "/webrtc/src/dcep_protocol.c",
                  "/webrtc/src/dtls_session.c",
                  "/webrtc/src/sctp_session.c",
                  "/webrtc/src/stb_sprintf.c",
              ),
              "-fsanitize=address,undefined",
          )
          PY

      - name: Build and test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $build = Join-Path $env:GITHUB_WORKSPACE "build/platform-${{ matrix.platform }}"
          $runtimeDirs = @()
          foreach ($name in @("SALTS_ROOT", "SALTS_UTILS_ROOT", "SALTSNET_ROOT", "CHTTP_ROOT", "RULES_FORGE_ROOT")) {
            $root = [Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrWhiteSpace($root)) { continue }
            foreach ($leaf in @("bin", "lib")) {
              $candidate = Join-Path $root $leaf
              if (Test-Path -LiteralPath $candidate -PathType Container) {
                $runtimeDirs += $candidate
              }
            }
          }
          $vcpkgRuntime = Join-Path $env:GITHUB_WORKSPACE "vcpkg_installed/${{ matrix.triplet }}"
          foreach ($leaf in @("bin", "lib")) {
            $candidate = Join-Path $vcpkgRuntime $leaf
            if (Test-Path -LiteralPath $candidate -PathType Container) {
              $runtimeDirs += $candidate
            }
          }
          if ($IsWindows) {
            $env:PATH = ($runtimeDirs + $env:PATH) -join [IO.Path]::PathSeparator
          } elseif ($IsMacOS) {
            $parts = @($runtimeDirs)
            if (-not [string]::IsNullOrWhiteSpace($env:DYLD_LIBRARY_PATH)) { $parts += $env:DYLD_LIBRARY_PATH }
            $env:DYLD_LIBRARY_PATH = $parts -join [IO.Path]::PathSeparator
          } else {
            $parts = @($runtimeDirs)
            if (-not [string]::IsNullOrWhiteSpace($env:LD_LIBRARY_PATH)) { $parts += $env:LD_LIBRARY_PATH }
            $env:LD_LIBRARY_PATH = $parts -join [IO.Path]::PathSeparator
          }
          & cmake --build --preset ci-platform-build
          if ($LASTEXITCODE -ne 0) { throw "build failed for ${{ matrix.platform }}" }
          if ("${{ matrix.platform }}" -ne "Android") {
            & ctest --preset ci-platform-test
            if ($LASTEXITCODE -ne 0) { throw "CTest failed for ${{ matrix.platform }}" }
          }

      - name: Compiler cache statistics
        if: always()
        shell: pwsh
        run: |
          & ccache --show-stats
          if ($LASTEXITCODE -ne 0) { throw "ccache statistics failed" }

      - name: Repeat C11 SCTP handoff under ThreadSanitizer
        if: matrix.platform == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          build="$GITHUB_WORKSPACE/build/platform-Linux"
          for name in turbo_media_test_salts_c11_sctp_dtls_handoff turbo_media_test_c11_sctp_dtls_records turbo_media_test_c11_sctp_peer_bridge turbo_media_test_datachannel_peer_destroy_drain; do
            binary="$build/bin/$name"
            test -x "$binary"
            ldd "$binary" | tee "$build/$name-ldd.txt"
            grep -q "libtsan" "$build/$name-ldd.txt"
          done
          TSAN_OPTIONS="halt_on_error=1:exitcode=66" ctest --test-dir "$build" -R "^(turbo_media_test_salts_c11_sctp_dtls_handoff|turbo_media_test_c11_sctp_dtls_records|turbo_media_test_c11_sctp_peer_bridge|turbo_media_test_datachannel_peer_destroy_drain)$" --repeat until-fail:20 --no-tests=error --output-on-failure --timeout 30

      - name: Install
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $build = Join-Path $env:GITHUB_WORKSPACE "build/platform-${{ matrix.platform }}"
          $stage = Join-Path $env:GITHUB_WORKSPACE "stage/platform-${{ matrix.platform }}"
          & cmake --install $build
          if ($LASTEXITCODE -ne 0) { throw "install failed for ${{ matrix.platform }}" }
          $config = Join-Path $stage "lib/cmake/TurboMedia/TurboMediaConfig.cmake"
          if (-not (Test-Path -LiteralPath $config -PathType Leaf)) {
            throw "missing installed TurboMediaConfig.cmake"
          }
          if (Select-String -LiteralPath $config -SimpleMatch "TurboMedia_PRODUCT") {
            throw "installed package still exposes obsolete product identity"
          }

      - name: Independently consume installed RTSP RFC2250 C11/C++17 SDK
        if: matrix.platform != 'Android'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = Join-Path $env:GITHUB_WORKSPACE "stage/platform-${{ matrix.platform }}"
          $build = Join-Path $env:GITHUB_WORKSPACE "build/independent-rtsp-${{ matrix.platform }}"
          $vcpkgInstalled = Join-Path $env:GITHUB_WORKSPACE "vcpkg_installed"
          $args = @(
            "-S", "tests/rtsp_package_consumer",
            "-B", $build, "-G", "Ninja",
            "-DCMAKE_BUILD_TYPE=Release",
            "-DCMAKE_PREFIX_PATH=$stage",
            "-DCMAKE_TOOLCHAIN_FILE=$env:QIGAO_VCPKG_TOOLCHAIN_FILE",
            "-DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}",
            "-DVCPKG_INSTALLED_DIR=$vcpkgInstalled",
            "-DVCPKG_MANIFEST_MODE=OFF",
            "-DCMAKE_FIND_USE_PACKAGE_REGISTRY=FALSE",
            "-DCMAKE_FIND_USE_SYSTEM_PACKAGE_REGISTRY=FALSE"
          )
          & cmake @args
          if ($LASTEXITCODE -ne 0) { throw "independent RTSP SDK configure failed" }
          & cmake --build $build --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "independent RTSP SDK compile/link failed" }
          $runtimeDirs = @()
          foreach ($root in @($stage,
              $env:SALTS_ROOT, $env:SALTS_UTILS_ROOT, $env:SALTSNET_ROOT,
              $env:CHTTP_ROOT, (Join-Path $vcpkgInstalled "${{ matrix.triplet }}"))) {
            if ([string]::IsNullOrWhiteSpace($root)) { continue }
            foreach ($leaf in @("bin", "lib")) {
              $dir = Join-Path $root $leaf
              if (Test-Path -LiteralPath $dir -PathType Container) {
                $runtimeDirs += $dir
              }
            }
          }
          if ($IsWindows) {
            $env:PATH = ($runtimeDirs + $env:PATH) -join [IO.Path]::PathSeparator
          } elseif ($IsMacOS) {
            $env:DYLD_LIBRARY_PATH =
              ($runtimeDirs + @($env:DYLD_LIBRARY_PATH)) -join [IO.Path]::PathSeparator
          } else {
            $env:LD_LIBRARY_PATH =
              ($runtimeDirs + @($env:LD_LIBRARY_PATH)) -join [IO.Path]::PathSeparator
          }
          & ctest --test-dir $build --no-tests=error --output-on-failure --timeout 60
          if ($LASTEXITCODE -ne 0) { throw "independent installed RTSP ABI conformance failed" }
