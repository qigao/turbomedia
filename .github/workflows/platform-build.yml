name: Platform Build

on:
  pull_request:
    paths:
      - ".github/workflows/platform-build.yml"
      - "cmake/ci/restore-turbomedia-platform-deps.ps1"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "CMakeUserPresets.json"
      - "presets/**"
      - "cmake/**"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
      - "vcpkg-overlays/**"
      - "common/**"
      - "core/**"
      - "crypto/**"
      - "speech/**"
      - "codec/**"
      - "muxer/**"
      - "demuxer/**"
      - "network/**"
      - "transport/**"
      - "player/**"
      - "client_processing/**"
      - "recognition/**"
      - "media/**"
      - "server/**"
      - "streamer/**"
      - "pipeline/**"
      - "webrtc/**"
      - "examples/**"
      - "tests/**"
  push:
    branches: [master]
    paths:
      - ".github/workflows/platform-build.yml"
      - "cmake/ci/restore-turbomedia-platform-deps.ps1"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "CMakeUserPresets.json"
      - "presets/**"
      - "cmake/**"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
      - "vcpkg-overlays/**"
      - "common/**"
      - "core/**"
      - "crypto/**"
      - "speech/**"
      - "codec/**"
      - "muxer/**"
      - "demuxer/**"
      - "network/**"
      - "transport/**"
      - "player/**"
      - "client_processing/**"
      - "recognition/**"
      - "media/**"
      - "server/**"
      - "streamer/**"
      - "pipeline/**"
      - "webrtc/**"
      - "examples/**"
      - "tests/**"

permissions:
  contents: read
  packages: read
  actions: read

env:
  # Persistent media binary packages are produced and owned by qigao/vcpkg-cache.
  X_VCPKG_NUGET_ID_PREFIX: vcpkg-cache

concurrency:
  group: platform-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      TURBOMEDIA_CI_TRIPLET: ${{ matrix.triplet }}
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_COMPRESS: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-24.04
            rid: linux-x64
            triplet: x64-linux
          - platform: Windows
            os: windows-2022
            rid: windows-x64
            triplet: x64-windows
          - platform: Android
            os: ubuntu-24.04
            rid: android-arm64-v8a
            triplet: arm64-android-api26
          - platform: macOS
            os: macos-15
            rid: macos-arm64
            triplet: arm64-osx

    steps:
      - uses: actions/checkout@v7
        with:
          # PRs are validated at the authored source commit, not a synthetic
          # merge-ref revision. Stacked PR #154 carries its #152 base commits.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checked-out source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $expected = "${{ github.event.pull_request.head.sha || github.sha }}"
          $actual = & git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actual.Trim() -ne $expected) {
            throw "CI checkout does not match its exact PR source SHA"
          }

      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read

      - uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@master

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Prepare Linux and Android build tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config nasm autoconf automake libtool
          if [ "${{ matrix.platform }}" = "Linux" ]; then
            sudo apt-get install -y --no-install-recommends \
              libpipewire-0.3-dev libx11-dev libxext-dev
          else
            test -n "${ANDROID_NDK_HOME:-}"
            test -f "$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
          fi

      - name: Prepare Windows build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install ninja nasm strawberryperl -y --no-progress
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products "*" -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($vs)) {
            throw "x64 MSVC was not found"
          }
          $canonicalVcpkgRoot = $env:VCPKG_ROOT
          $vsdev = Join-Path $vs "Common7/Tools/VsDevCmd.bat"
          $command = 'call "' + $vsdev + '" -arch=x64 -host_arch=x64 >nul && set'
          $lines = & cmd.exe /d /s /c $command
          if ($LASTEXITCODE -ne 0) { throw "VsDevCmd failed" }
          foreach ($line in $lines) {
            if ($line -match '^([^=]+)=(.*)$') {
              "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }
          "VCPKG_ROOT=$canonicalVcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare macOS build tools
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          brew install ninja nasm autoconf automake libtool

      # TurboMedia object caching is separate from the central, read-only
      # vcpkg binary packages and released platform SDKs restored below.
      - name: Restore compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: turbomedia-${{ matrix.rid }}-${{ matrix.triplet }}-release-v1
          max-size: 500M

      - name: Verify compiler cache
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & ccache --version
          if ($LASTEXITCODE -ne 0) { throw "ccache is unavailable" }
          & ccache --zero-stats
          if ($LASTEXITCODE -ne 0) { throw "failed to initialize ccache statistics" }

      - name: Restore latest platform SDKs
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./cmake/ci/restore-turbomedia-platform-deps.ps1 -Rid "${{ matrix.rid }}"

      # Only this Draft branch can consume unpublished, exact-source CI
      # artifacts. Never publish these packages or ship their SHA as a
      # permanent dependency: released SDK restores remain authoritative.
      - name: Stage qualified ACE/CNet candidate consumers
        if: >-
          github.event_name == 'pull_request' &&
          (github.head_ref == 'feature/ace-cnet-owner-transport' ||
           github.head_ref == 'fix/http-flv-owner-drain-recovery' ||
           github.head_ref == 'diagnostics/whip-sfu-restart-windows')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $rid = "${{ matrix.rid }}"
          $candidates = @(
            @{
              name = "SaltsNet"
              repo = "qigao/salts-net"
              run = "37952520605"
              artifact = "saltsnet-sdk-$rid"
              expected = "a74b3a8ed8a7f297a57307aac99d541c63dd0c7c"
              manifest = "saltsnet-sdk-manifest.txt"
              config = "lib/cmake/SaltsNet/SaltsNetConfig.cmake"
              root = "SALTSNET_ROOT"
            },
            @{
              name = "CHttp"
              repo = "qigao/chttp"
              run = "37951497030"
              artifact = $(if ($rid -eq "macos-arm64") { "chttp-sdk-macos" } else { "chttp-sdk-$rid" })
              expected = "e46187214dca7d4572811704c159b9a29ad26b4a"
              manifest = "chttp-sdk-manifest.txt"
              config = "lib/cmake/Chttp/ChttpConfig.cmake"
              root = "CHTTP_ROOT"
            }
          )
          # The published Salts.Native 2.3.0-rc.1 macOS archive uses GCC
          # emulated TLS, incompatible with AppleClang C11 TinyTest consumers.
          # The canonical master CI at this exact source SHA independently
          # installed, compiled and ran the native-TLS C11 smoke. This is a
          # macOS-only, draft-only test artifact; NEVER a release substitute.
          if ($rid -eq "macos-arm64") {
            $candidates += @{
              name = "Salts"
              repo = "qigao/salts"
              run = "37963767058"
              artifact = "salts-sdk-macos-tinytest-candidate"
              expected = "10c17c9c2b0d558addf2490c93cc13aa430906b0"
              manifest = "salts-sdk-manifest.txt"
              config = "lib/cmake/Salts/SaltsConfig.cmake"
              root = "SALTS_ROOT"
            }
            # The old SaltsUtils.Native 4.3.0-rc.1 exports another
            # Salts::Unicode, which CMake correctly rejects. This paired
            # macOS candidate removed the duplicate and independently passed
            # 235/235 native CTests plus 2/2 installed C11/C++17 consumers.
            $candidates += @{
              name = "SaltsUtils"
              repo = "qigao/salts-utils"
              run = "37967646451"
              artifact = "saltsutils-sdk-macos-unicode-candidate"
              expected = "997b2768a8f0ffaad48108dbd9c68863f250a270"
              manifest = "salts-utils-sdk-manifest.txt"
              config = "lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake"
              root = "SALTS_UTILS_ROOT"
            }
          }
          foreach ($candidate in $candidates) {
            $details = & gh api "repos/$($candidate.repo)/actions/runs/$($candidate.run)" --jq "{head_sha: .head_sha, conclusion: .conclusion}"
            if ($LASTEXITCODE -ne 0) { throw "$($candidate.name): GitHub Actions run metadata unavailable" }
            $runInfo = $details | ConvertFrom-Json
            if ($runInfo.conclusion -ne "success" -or $runInfo.head_sha -ne $candidate.expected) {
              throw "$($candidate.name): candidate run does not match the exact successful source SHA"
            }
            $destination = Join-Path $env:RUNNER_TEMP "turbomedia-ace-candidate-$($candidate.name)"
            New-Item -ItemType Directory -Path $destination -Force | Out-Null
            & gh run download $candidate.run -R $candidate.repo -n $candidate.artifact -D $destination
            if ($LASTEXITCODE -ne 0) { throw "$($candidate.name): exact CI artifact missing" }
            $root = Join-Path $destination $rid
            $config = Join-Path $root $candidate.config
            $manifest = Join-Path $root $candidate.manifest
            if (-not (Test-Path -LiteralPath $config -PathType Leaf) -or
                -not (Test-Path -LiteralPath $manifest -PathType Leaf)) {
              throw "$($candidate.name): candidate RID configuration/provenance missing: $rid"
            }
            $manifestText = Get-Content -LiteralPath $manifest -Raw
            $expectedLine = "commit=$($candidate.expected)"
            if ($manifestText -notmatch "(?m)^$([regex]::Escape($expectedLine))\r?$") {
              throw "$($candidate.name): SDK install commit differs from its exact source"
            }
            if ($candidate.name -eq "Salts") {
              foreach ($required in @("os=macos", "arch=ARM64", "profile=release")) {
                if ($manifestText -notmatch "(?m)^$([regex]::Escape($required))\r?$") {
                  throw "Salts: candidate SDK identity mismatch: $required"
                }
              }
              if (-not (Test-Path -LiteralPath (Join-Path $root "lib/libtinytest.a") -PathType Leaf)) {
                throw "Salts: native TinyTest archive absent from qualified macOS candidate"
              }
            }
            if ($candidate.name -eq "SaltsUtils") {
              $qualifiedSalts = "salts_sha=10c17c9c2b0d558addf2490c93cc13aa430906b0"
              foreach ($required in @($qualifiedSalts, "os=macos", "arch=ARM64",
                                       "profile=release", "release_qualified=false")) {
                if ($manifestText -notmatch "(?m)^$([regex]::Escape($required))\r?$") {
                  throw "SaltsUtils: paired SDK identity mismatch: $required"
                }
              }
              $targets = Join-Path $root "lib/cmake/SaltsUtils/SaltsUtilsTargets.cmake"
              if (-not (Test-Path -LiteralPath $targets -PathType Leaf)) {
                throw "SaltsUtils: installed CMake target export absent"
              }
              if (Select-String -LiteralPath $targets -SimpleMatch "add_library(Salts::Unicode") {
                throw "SaltsUtils: duplicate Unicode target remains in candidate export"
              }
            }
            $root = $root.Replace('\', '/')
            "$($candidate.root)=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            foreach ($leaf in @("bin", "lib")) {
              $entry = Join-Path $root $leaf
              if (Test-Path -LiteralPath $entry -PathType Container) {
                $entry | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              }
            }
            Write-Host "Qualified $($candidate.name) from $($candidate.repo) at $($candidate.expected), RID=$rid"
          }

      - name: Restore media dependencies cache-only
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installed = Join-Path $env:GITHUB_WORKSPACE "vcpkg_installed"
          $vcpkg = Join-Path $env:VCPKG_ROOT $(if ($IsWindows) { "vcpkg.exe" } else { "vcpkg" })
          Remove-Item -LiteralPath $installed -Recurse -Force -ErrorAction SilentlyContinue
          & $vcpkg install "--x-manifest-root=." "--x-install-root=$installed" "--triplet=${{ matrix.triplet }}" --only-binarycaching
          if ($LASTEXITCODE -ne 0) { throw "cache-only vcpkg restore failed" }

      # Independent installed-ABI gate: this can compile/test Salts::CNet 2.3
      # even while older SaltsNet/CHttp binary SDKs block the full media graph.
      # It does not replace the full Configure / CTest / Install gate below.
      - name: Verify installed ACE/CNet owner ABI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $build = Join-Path $env:GITHUB_WORKSPACE "build/ace-cnet-owner-sdk"
          $args = @(
            "-S", "tests/ace_cnet_owner_sdk",
            "-B", $build,
            "-G", "Ninja",
            "-DCMAKE_BUILD_TYPE=Release",
            "-DCMAKE_TOOLCHAIN_FILE=$env:QIGAO_VCPKG_TOOLCHAIN_FILE",
            "-DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}",
            "-DVCPKG_MANIFEST_MODE=OFF",
            "-DVCPKG_INSTALLED_DIR=$env:GITHUB_WORKSPACE/vcpkg_installed",
            "-DCMAKE_C_COMPILER_LAUNCHER=ccache"
          )
          if ("${{ matrix.platform }}" -eq "Android") {
            $args += @(
              "-DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=$env:ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake",
              "-DCMAKE_SYSTEM_NAME=Android",
              "-DANDROID_ABI=arm64-v8a",
              "-DANDROID_PLATFORM=android-26",
              "-DANDROID_STL=c++_shared"
            )
          }
          & cmake @args
          if ($LASTEXITCODE -ne 0) { throw "ACE/CNet installed SDK configure failed" }
          & cmake --build $build --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "ACE/CNet installed SDK build failed" }
          if ("${{ matrix.platform }}" -ne "Android") {
            $saltsLib = Join-Path $env:SALTS_ROOT "lib"
            $saltsBin = Join-Path $env:SALTS_ROOT "bin"
            if ($IsWindows) {
              $env:PATH = "$saltsBin$([IO.Path]::PathSeparator)$saltsLib$([IO.Path]::PathSeparator)$env:PATH"
            } elseif ($IsMacOS) {
              $env:DYLD_LIBRARY_PATH = "$saltsLib$([IO.Path]::PathSeparator)$env:DYLD_LIBRARY_PATH"
            } else {
              $env:LD_LIBRARY_PATH = "$saltsLib$([IO.Path]::PathSeparator)$env:LD_LIBRARY_PATH"
            }
            & ctest --test-dir $build --no-tests=error --output-on-failure
            if ($LASTEXITCODE -ne 0) { throw "ACE/CNet installed SDK runtime failed" }
          }
      - name: Configure
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($directory in @("build/ci-platform", "stage/ci-platform")) {
            $path = Join-Path $env:GITHUB_WORKSPACE $directory
            Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction SilentlyContinue
          }
          $args = @()
          if ("${{ matrix.platform }}" -eq "Android") {
            $args += @(
              "-DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=$env:ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake",
              "-DCMAKE_SYSTEM_NAME=Android",
              "-DANDROID_ABI=arm64-v8a",
              "-DANDROID_PLATFORM=android-26",
              "-DANDROID_STL=c++_shared"
            )
          }
          & cmake --preset ci-platform-release @args
          if ($LASTEXITCODE -ne 0) { throw "configure failed for ${{ matrix.platform }}" }

      # Diagnostics only: the released macOS TinyTest archive currently
      # produces an undefined _ttest_active_config__ in test_speech. Do not
      # disable that test, redefine its TLS global, or link a fallback runtime.
      - name: Diagnose macOS released TinyTest linkage
        if: matrix.platform == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          archive="$SALTS_ROOT/lib/libtinytest.a"
          test -f "$archive"
          echo "TinyTest externally visible definitions:"
          nm -gU "$archive" | grep -E 'ttest_active_config__|ttest_run__|ttest_specs__' || true
          echo "TinyTest complete symbol table matches:"
          nm -m "$archive" | grep -E 'ttest_active_config__|ttest_run__|ttest_specs__' || true
          echo "TinyTest architecture:"
          lipo -info "$archive"

      - name: Build and test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Only emits bounded stage/status codes on HTTP-FLV upload failure.
          $env:TURBOMEDIA_HTTP_FLV_TRACE = "1"
          $build = Join-Path $env:GITHUB_WORKSPACE "build/ci-platform"
          $runtimeDirs = @()
          foreach ($name in @("SALTS_ROOT", "SALTS_UTILS_ROOT", "SALTSNET_ROOT", "CHTTP_ROOT", "RULES_FORGE_ROOT")) {
            $root = [Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrWhiteSpace($root)) { continue }
            foreach ($leaf in @("bin", "lib")) {
              $candidate = Join-Path $root $leaf
              if (Test-Path -LiteralPath $candidate -PathType Container) {
                $runtimeDirs += $candidate
              }
            }
          }
          $vcpkgRuntime = Join-Path $env:GITHUB_WORKSPACE "vcpkg_installed/${{ matrix.triplet }}"
          foreach ($leaf in @("bin", "lib")) {
            $candidate = Join-Path $vcpkgRuntime $leaf
            if (Test-Path -LiteralPath $candidate -PathType Container) {
              $runtimeDirs += $candidate
            }
          }
          if ($IsWindows) {
            $env:PATH = ($runtimeDirs + $env:PATH) -join [IO.Path]::PathSeparator
          } elseif ($IsMacOS) {
            $parts = @($runtimeDirs)
            if (-not [string]::IsNullOrWhiteSpace($env:DYLD_LIBRARY_PATH)) { $parts += $env:DYLD_LIBRARY_PATH }
            $env:DYLD_LIBRARY_PATH = $parts -join [IO.Path]::PathSeparator
          } else {
            $parts = @($runtimeDirs)
            if (-not [string]::IsNullOrWhiteSpace($env:LD_LIBRARY_PATH)) { $parts += $env:LD_LIBRARY_PATH }
            $env:LD_LIBRARY_PATH = $parts -join [IO.Path]::PathSeparator
          }
          & cmake --build --preset ci-platform-build
          if ($LASTEXITCODE -ne 0) { throw "build failed for ${{ matrix.platform }}" }
          & ccache --show-stats
          if ($LASTEXITCODE -ne 0) { throw "ccache stats failed" }
          if ("${{ matrix.platform }}" -ne "Android") {
            & ctest --preset ci-platform-test
            if ($LASTEXITCODE -ne 0) { throw "CTest failed for ${{ matrix.platform }}" }
            # Draft diagnostics only: two additional source-identical real
            # SFU restarts must both pass. No skipped tests, wider production
            # deadlines, application replay or automatic settlement retry.
            if ("${{ matrix.platform }}" -eq "Windows" -and
                "${{ github.head_ref }}" -eq "diagnostics/whip-sfu-restart-windows") {
              # CTest normally hides successful test stdout. Capture only the
              # generated numeric timing record; never print verbose SFU/SDP
              # output, Authorization headers or raw test logs.
              & ctest --preset ci-platform-test -R "^test_ivr_whip_transport$" --repeat "until-fail:2" --output-on-failure --timeout 180 -V 2>&1 |
                ForEach-Object {
                  $line = [string]$_
                  if ($line -match '\[whip-restart-timing\] (?:[a-z_]+_ms=\d+ ?){7}') {
                    Write-Host $Matches[0]
                  }
                }
              if ($LASTEXITCODE -ne 0) {
                throw "Windows SFU/WHIP restart repeatability gate failed"
              }
            }
          }

      # Separate test-only build: compile TurboMedia wrappers with ASan/UBSan
      # against the same exact installed candidate SDK graph. Build targets,
      # test selection and sanitizer flags are CMake Preset owned.
      - name: Linux ACE owner ASan and UBSan
        if: >-
          matrix.platform == 'Linux' &&
          github.event_name == 'pull_request' &&
          github.head_ref == 'fix/http-flv-owner-drain-recovery'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $runtimeDirs = @()
          foreach ($name in @("SALTS_ROOT", "SALTS_UTILS_ROOT", "SALTSNET_ROOT", "CHTTP_ROOT", "RULES_FORGE_ROOT")) {
            $root = [Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrWhiteSpace($root)) { continue }
            foreach ($leaf in @("bin", "lib")) {
              $candidate = Join-Path $root $leaf
              if (Test-Path -LiteralPath $candidate -PathType Container) { $runtimeDirs += $candidate }
            }
          }
          $vcpkgRuntime = Join-Path $env:GITHUB_WORKSPACE "vcpkg_installed/${{ matrix.triplet }}"
          foreach ($leaf in @("bin", "lib")) {
            $candidate = Join-Path $vcpkgRuntime $leaf
            if (Test-Path -LiteralPath $candidate -PathType Container) { $runtimeDirs += $candidate }
          }
          $parts = @($runtimeDirs)
          if (-not [string]::IsNullOrWhiteSpace($env:LD_LIBRARY_PATH)) { $parts += $env:LD_LIBRARY_PATH }
          $env:LD_LIBRARY_PATH = $parts -join [IO.Path]::PathSeparator
          $env:ASAN_OPTIONS = "detect_leaks=1:halt_on_error=1:abort_on_error=1"
          $env:UBSAN_OPTIONS = "halt_on_error=1:print_stacktrace=1"
          & cmake --preset ci-platform-linux-asan-ubsan
          if ($LASTEXITCODE -ne 0) { throw "Linux ACE ASan/UBSan configure failed" }
          & cmake --build --preset ci-platform-linux-asan-ubsan-build
          if ($LASTEXITCODE -ne 0) { throw "Linux ACE ASan/UBSan build failed" }
          & ctest --preset ci-platform-linux-asan-ubsan
          if ($LASTEXITCODE -ne 0) { throw "Linux ACE ASan/UBSan native tests failed" }

      - name: Install
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $build = Join-Path $env:GITHUB_WORKSPACE "build/ci-platform"
          $stage = Join-Path $env:GITHUB_WORKSPACE "stage/ci-platform"
          & cmake --install $build
          if ($LASTEXITCODE -ne 0) { throw "install failed for ${{ matrix.platform }}" }
          $config = Join-Path $stage "lib/cmake/TurboMedia/TurboMediaConfig.cmake"
          if (-not (Test-Path -LiteralPath $config -PathType Leaf)) {
            throw "missing installed TurboMediaConfig.cmake"
          }
          if (Select-String -LiteralPath $config -SimpleMatch "TurboMedia_PRODUCT") {
            throw "installed package still exposes obsolete product identity"
          }
