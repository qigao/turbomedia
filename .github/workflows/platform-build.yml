name: Platform Build

on:
  pull_request:
    paths:
      - ".github/workflows/platform-build.yml"
      - "cmake/ci/restore-turbomedia-platform-deps.ps1"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "CMakeUserPresets.json"
      - "presets/**"
      - "cmake/**"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
      - "vcpkg-overlays/**"
      - "common/**"
      - "core/**"
      - "crypto/**"
      - "speech/**"
      - "codec/**"
      - "muxer/**"
      - "demuxer/**"
      - "network/**"
      - "transport/**"
      - "player/**"
      - "client_processing/**"
      - "recognition/**"
      - "media/**"
      - "server/**"
      - "streamer/**"
      - "pipeline/**"
      - "webrtc/**"
      - "examples/**"
      - "tests/**"
  push:
    branches: [master]
    paths:
      - ".github/workflows/platform-build.yml"
      - "cmake/ci/restore-turbomedia-platform-deps.ps1"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "CMakeUserPresets.json"
      - "presets/**"
      - "cmake/**"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
      - "vcpkg-overlays/**"
      - "common/**"
      - "core/**"
      - "crypto/**"
      - "speech/**"
      - "codec/**"
      - "muxer/**"
      - "demuxer/**"
      - "network/**"
      - "transport/**"
      - "player/**"
      - "client_processing/**"
      - "recognition/**"
      - "media/**"
      - "server/**"
      - "streamer/**"
      - "pipeline/**"
      - "webrtc/**"
      - "examples/**"
      - "tests/**"

permissions:
  contents: read
  packages: read
  actions: read

env:
  # Persistent media binary packages are produced and owned by qigao/vcpkg-cache.
  X_VCPKG_NUGET_ID_PREFIX: vcpkg-cache

concurrency:
  group: platform-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      TURBOMEDIA_CI_TRIPLET: ${{ matrix.triplet }}
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_COMPRESS: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-24.04
            rid: linux-x64
            triplet: x64-linux
          - platform: Windows
            os: windows-2022
            rid: windows-x64
            triplet: x64-windows
          - platform: Android
            os: ubuntu-24.04
            rid: android-arm64-v8a
            triplet: arm64-android-api26
          - platform: macOS
            os: macos-15
            rid: macos-arm64
            triplet: arm64-osx

    steps:
      - uses: actions/checkout@v7
        with:
          # PRs are validated at the authored source commit, not a synthetic
          # merge-ref revision. Stacked PR #154 carries its #152 base commits.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checked-out source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $expected = "${{ github.event.pull_request.head.sha || github.sha }}"
          $actual = & git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actual.Trim() -ne $expected) {
            throw "CI checkout does not match its exact PR source SHA"
          }

      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read

      - uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@master

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Prepare Linux and Android build tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config nasm autoconf automake libtool
          if [ "${{ matrix.platform }}" = "Linux" ]; then
            sudo apt-get install -y --no-install-recommends \
              libpipewire-0.3-dev libx11-dev libxext-dev libssl-dev
          else
            test -n "${ANDROID_NDK_HOME:-}"
            test -f "$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
          fi

      - name: Prepare Windows build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install ninja nasm strawberryperl -y --no-progress
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products "*" -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($vs)) {
            throw "x64 MSVC was not found"
          }
          $canonicalVcpkgRoot = $env:VCPKG_ROOT
          $vsdev = Join-Path $vs "Common7/Tools/VsDevCmd.bat"
          $command = 'call "' + $vsdev + '" -arch=x64 -host_arch=x64 >nul && set'
          $lines = & cmd.exe /d /s /c $command
          if ($LASTEXITCODE -ne 0) { throw "VsDevCmd failed" }
          foreach ($line in $lines) {
            if ($line -match '^([^=]+)=(.*)$') {
              "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }
          "VCPKG_ROOT=$canonicalVcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare macOS build tools
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          brew install ninja nasm autoconf automake libtool

      # TurboMedia object caching is separate from the central, read-only
      # vcpkg binary packages and released platform SDKs restored below.
      - name: Restore compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: turbomedia-${{ matrix.rid }}-${{ matrix.triplet }}-release-v1
          max-size: 500M

      - name: Verify compiler cache
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & ccache --version
          if ($LASTEXITCODE -ne 0) { throw "ccache is unavailable" }
          & ccache --zero-stats
          if ($LASTEXITCODE -ne 0) { throw "failed to initialize ccache statistics" }

      - name: Restore latest platform SDKs
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./cmake/ci/restore-turbomedia-platform-deps.ps1 -Rid "${{ matrix.rid }}"

      # Only qualified SaltsNet/CHttp SDK candidates are overlaid here on
      # Draft branches. Salts/SaltsUtils always use the released paired RCs;
      # never publish or permanently pin these downstream candidates.
      - name: Stage qualified ACE/CNet candidate consumers
        if: >-
          github.event_name == 'pull_request' &&
          (github.head_ref == 'feature/ace-cnet-owner-transport' ||
           github.head_ref == 'fix/http-flv-owner-drain-recovery' ||
           github.head_ref == 'diagnostics/whip-sfu-restart-windows' ||
           github.head_ref == 'diagnostics/dc-channel-close-red-195' ||
           github.head_ref == 'fix/dc-channel-callback-leases-195' ||
           github.head_ref == 'fix/sctp-status-close-drain-198' ||
           github.head_ref == 'feature/sctp-native-operation-owner-201' ||
           github.head_ref == 'test/sctp-late-comm-up-red-201' ||
           github.head_ref == 'fix/sctp-comm-up-native-owner-201' ||
           github.head_ref == 'test/sctp-channel-reset-close-red-201' ||
           github.head_ref == 'fix/sctp-channel-reset-owner-201' ||
           github.head_ref == 'test/sctp-native-owner-consolidated-201' ||
           github.head_ref == 'test/sctp-manual-timer-elapsed-red-208' ||
           github.head_ref == 'fix/sctp-monotonic-timer-pump-208' ||
           github.head_ref == 'test/sctp-timer-reentrant-callback-208' ||
           github.head_ref == 'test/sctp-real-timer-foreign-close-208')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $rid = "${{ matrix.rid }}"
          $candidates = @(
            @{
              name = "SaltsNet"
              repo = "qigao/salts-net"
              # Exact six-RID artifact from SaltsNet ICE-close Draft #54.
              # Not a published SDK; never resolve a different candidate.
              run = "38264634750"
              artifact = "saltsnet-sdk-$rid"
              expected = "c55153e38cc9ad4a6bf418eca9bb35de90985217"
              manifest = "saltsnet-sdk-manifest.txt"
              config = "lib/cmake/SaltsNet/SaltsNetConfig.cmake"
              root = "SALTSNET_ROOT"
            },
            @{
              name = "CHttp"
              repo = "qigao/chttp"
              run = "37951497030"
              artifact = $(if ($rid -eq "macos-arm64") { "chttp-sdk-macos" } else { "chttp-sdk-$rid" })
              expected = "e46187214dca7d4572811704c159b9a29ad26b4a"
              manifest = "chttp-sdk-manifest.txt"
              config = "lib/cmake/Chttp/ChttpConfig.cmake"
              root = "CHTTP_ROOT"
            }
          )
          # Salts and SaltsUtils always come from the verified paired
          # official published SDKs restored above on every RID.
          foreach ($candidate in $candidates) {
            $details = & gh api "repos/$($candidate.repo)/actions/runs/$($candidate.run)" --jq "{head_sha: .head_sha, conclusion: .conclusion}"
            if ($LASTEXITCODE -ne 0) { throw "$($candidate.name): GitHub Actions run metadata unavailable" }
            $runInfo = $details | ConvertFrom-Json
            if ($runInfo.conclusion -ne "success" -or $runInfo.head_sha -ne $candidate.expected) {
              throw "$($candidate.name): candidate run does not match the exact successful source SHA"
            }
            $destination = Join-Path $env:RUNNER_TEMP "turbomedia-ace-candidate-$($candidate.name)"
            New-Item -ItemType Directory -Path $destination -Force | Out-Null
            & gh run download $candidate.run -R $candidate.repo -n $candidate.artifact -D $destination
            if ($LASTEXITCODE -ne 0) { throw "$($candidate.name): exact CI artifact missing" }
            $root = Join-Path $destination $rid
            $config = Join-Path $root $candidate.config
            $manifest = Join-Path $root $candidate.manifest
            if (-not (Test-Path -LiteralPath $config -PathType Leaf) -or
                -not (Test-Path -LiteralPath $manifest -PathType Leaf)) {
              throw "$($candidate.name): candidate RID configuration/provenance missing: $rid"
            }
            $manifestText = Get-Content -LiteralPath $manifest -Raw
            $expectedLine = "commit=$($candidate.expected)"
            if ($manifestText -notmatch "(?m)^$([regex]::Escape($expectedLine))\r?$") {
              throw "$($candidate.name): SDK install commit differs from its exact source"
            }
            $root = $root.Replace('\', '/')
            "$($candidate.root)=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            foreach ($leaf in @("bin", "lib")) {
              $entry = Join-Path $root $leaf
              if (Test-Path -LiteralPath $entry -PathType Container) {
                $entry | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              }
            }
            Write-Host "Qualified $($candidate.name) from $($candidate.repo) at $($candidate.expected), RID=$rid"
          }

      - name: Restore media dependencies cache-only
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installed = Join-Path $env:GITHUB_WORKSPACE "vcpkg_installed"
          $vcpkg = Join-Path $env:VCPKG_ROOT $(if ($IsWindows) { "vcpkg.exe" } else { "vcpkg" })
          Remove-Item -LiteralPath $installed -Recurse -Force -ErrorAction SilentlyContinue
          & $vcpkg install "--x-manifest-root=." "--x-install-root=$installed" "--triplet=${{ matrix.triplet }}" --only-binarycaching
          if ($LASTEXITCODE -ne 0) { throw "cache-only vcpkg restore failed" }

      # Independent installed-ABI gate: this can compile/test Salts::CNet 2.3
      # even while older SaltsNet/CHttp binary SDKs block the full media graph.
      # It does not replace the full Configure / CTest / Install gate below.
      - name: Verify installed ACE/CNet owner ABI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $build = Join-Path $env:GITHUB_WORKSPACE "build/ace-cnet-owner-sdk"
          $args = @(
            "-S", "tests/ace_cnet_owner_sdk",
            "-B", $build,
            "-G", "Ninja",
            "-DCMAKE_BUILD_TYPE=Release",
            "-DCMAKE_TOOLCHAIN_FILE=$env:QIGAO_VCPKG_TOOLCHAIN_FILE",
            "-DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}",
            "-DVCPKG_MANIFEST_MODE=OFF",
            "-DVCPKG_INSTALLED_DIR=$env:GITHUB_WORKSPACE/vcpkg_installed",
            "-DCMAKE_C_COMPILER_LAUNCHER=ccache"
          )
          if ("${{ matrix.platform }}" -eq "Android") {
            $args += @(
              "-DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=$env:ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake",
              "-DCMAKE_SYSTEM_NAME=Android",
              "-DANDROID_ABI=arm64-v8a",
              "-DANDROID_PLATFORM=android-26",
              "-DANDROID_STL=c++_shared"
            )
          }
          & cmake @args
          if ($LASTEXITCODE -ne 0) { throw "ACE/CNet installed SDK configure failed" }
          & cmake --build $build --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "ACE/CNet installed SDK build failed" }
          if ("${{ matrix.platform }}" -ne "Android") {
            $saltsLib = Join-Path $env:SALTS_ROOT "lib"
            $saltsBin = Join-Path $env:SALTS_ROOT "bin"
            if ($IsWindows) {
              $env:PATH = "$saltsBin$([IO.Path]::PathSeparator)$saltsLib$([IO.Path]::PathSeparator)$env:PATH"
            } elseif ($IsMacOS) {
              $env:DYLD_LIBRARY_PATH = "$saltsLib$([IO.Path]::PathSeparator)$env:DYLD_LIBRARY_PATH"
            } else {
              $env:LD_LIBRARY_PATH = "$saltsLib$([IO.Path]::PathSeparator)$env:LD_LIBRARY_PATH"
            }
            & ctest --test-dir $build --no-tests=error --output-on-failure
            if ($LASTEXITCODE -ne 0) { throw "ACE/CNet installed SDK runtime failed" }
          }
      - name: Configure
        shell: pwsh
        env:
          TURBOMEDIA_CI_HEAD_REF: ${{ github.head_ref }}
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($directory in @("build/ci-platform", "stage/ci-platform")) {
            $path = Join-Path $env:GITHUB_WORKSPACE $directory
            Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction SilentlyContinue
          }
          $args = @()
          if ("${{ matrix.platform }}" -eq "Android") {
            $args += @(
              "-DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=$env:ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake",
              "-DCMAKE_SYSTEM_NAME=Android",
              "-DANDROID_ABI=arm64-v8a",
              "-DANDROID_PLATFORM=android-26",
              "-DANDROID_STL=c++_shared"
            )
          }
          if ("${{ matrix.platform }}" -eq "Linux" -and
              $env:TURBOMEDIA_CI_HEAD_REF -in @("diagnostics/whip-sfu-restart-windows", "fix/dc-channel-callback-leases-195", "fix/sctp-status-close-drain-198", "feature/sctp-native-operation-owner-201", "test/sctp-late-comm-up-red-201", "fix/sctp-comm-up-native-owner-201", "test/sctp-channel-reset-close-red-201", "fix/sctp-channel-reset-owner-201", "test/sctp-native-owner-consolidated-201", "test/sctp-manual-timer-elapsed-red-208", "fix/sctp-monotonic-timer-pump-208", "test/sctp-timer-reentrant-callback-208", "test/sctp-real-timer-foreign-close-208")) {
            $args += "-DTURBO_MEDIA_TEST_INDEPENDENT_DTLS:BOOL=ON"
          }
          if ("${{ matrix.platform }}" -eq "Windows" -and
              $env:TURBOMEDIA_CI_HEAD_REF -eq "fix/dc-channel-callback-leases-195") {
            $args += "-DTURBO_MEDIA_TEST_WINDOWS_LINK_MAP:BOOL=ON"
          }
          & cmake --preset ci-platform-release @args
          if ($LASTEXITCODE -ne 0) { throw "configure failed for ${{ matrix.platform }}" }
          if ("${{ matrix.platform }}" -eq "Linux" -and
              $env:TURBOMEDIA_CI_HEAD_REF -in @("diagnostics/whip-sfu-restart-windows", "fix/dc-channel-callback-leases-195", "fix/sctp-status-close-drain-198", "feature/sctp-native-operation-owner-201", "test/sctp-late-comm-up-red-201", "fix/sctp-comm-up-native-owner-201", "test/sctp-channel-reset-close-red-201", "fix/sctp-channel-reset-owner-201", "test/sctp-native-owner-consolidated-201", "test/sctp-manual-timer-elapsed-red-208", "fix/sctp-monotonic-timer-pump-208", "test/sctp-timer-reentrant-callback-208", "test/sctp-real-timer-foreign-close-208")) {
            $cache = Join-Path $env:GITHUB_WORKSPACE "build/ci-platform/CMakeCache.txt"
            if (-not (Select-String -LiteralPath $cache -Pattern "^TURBO_MEDIA_TEST_INDEPENDENT_DTLS:BOOL=ON$" -Quiet)) {
              throw "Independent OpenSSL DTLS qualification is not enabled on the Linux Draft CI"
            }
            # A green default suite without this named CTest is not external
            # protocol acceptance. Fail the job before the expensive build.
            $names = & ctest --test-dir (Join-Path $env:GITHUB_WORKSPACE "build/ci-platform") -N -R "^turbo_media_test_dtls_openssl_interop$"
            if ($LASTEXITCODE -ne 0 -or
                -not ($names | Select-String -Pattern "Test #[0-9]+: turbo_media_test_dtls_openssl_interop" -Quiet)) {
              throw "Independent DTLS CTest registration is missing"
            }
          }

      # Diagnostics only: the released macOS TinyTest archive currently
      # produces an undefined _ttest_active_config__ in test_speech. Do not
      # disable that test, redefine its TLS global, or link a fallback runtime.
      - name: Diagnose macOS released TinyTest linkage
        if: matrix.platform == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          archive="$SALTS_ROOT/lib/libtinytest.a"
          test -f "$archive"
          echo "TinyTest externally visible definitions:"
          nm -gU "$archive" | grep -E 'ttest_active_config__|ttest_run__|ttest_specs__' || true
          echo "TinyTest complete symbol table matches:"
          nm -m "$archive" | grep -E 'ttest_active_config__|ttest_run__|ttest_specs__' || true
          echo "TinyTest architecture:"
          lipo -info "$archive"

      - name: Build and test
        shell: pwsh
        env:
          TURBOMEDIA_CI_HEAD_REF: ${{ github.head_ref }}
        run: |
          $ErrorActionPreference = "Stop"
          # Only emits bounded stage/status codes on HTTP-FLV upload failure.
          $env:TURBOMEDIA_HTTP_FLV_TRACE = "1"
          $build = Join-Path $env:GITHUB_WORKSPACE "build/ci-platform"
          $runtimeDirs = @()
          foreach ($name in @("SALTS_ROOT", "SALTS_UTILS_ROOT", "SALTSNET_ROOT", "CHTTP_ROOT", "RULES_FORGE_ROOT")) {
            $root = [Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrWhiteSpace($root)) { continue }
            foreach ($leaf in @("bin", "lib")) {
              $candidate = Join-Path $root $leaf
              if (Test-Path -LiteralPath $candidate -PathType Container) {
                $runtimeDirs += $candidate
              }
            }
          }
          $vcpkgRuntime = Join-Path $env:GITHUB_WORKSPACE "vcpkg_installed/${{ matrix.triplet }}"
          foreach ($leaf in @("bin", "lib")) {
            $candidate = Join-Path $vcpkgRuntime $leaf
            if (Test-Path -LiteralPath $candidate -PathType Container) {
              $runtimeDirs += $candidate
            }
          }
          if ($IsWindows) {
            $env:PATH = ($runtimeDirs + $env:PATH) -join [IO.Path]::PathSeparator
          } elseif ($IsMacOS) {
            $parts = @($runtimeDirs)
            if (-not [string]::IsNullOrWhiteSpace($env:DYLD_LIBRARY_PATH)) { $parts += $env:DYLD_LIBRARY_PATH }
            $env:DYLD_LIBRARY_PATH = $parts -join [IO.Path]::PathSeparator
          } else {
            $parts = @($runtimeDirs)
            if (-not [string]::IsNullOrWhiteSpace($env:LD_LIBRARY_PATH)) { $parts += $env:LD_LIBRARY_PATH }
            $env:LD_LIBRARY_PATH = $parts -join [IO.Path]::PathSeparator
          }
          & cmake --build --preset ci-platform-build
          if ($LASTEXITCODE -ne 0) { throw "build failed for ${{ matrix.platform }}" }

          # Private test-only symbolization of the *previous* confirmed
          # background-fault RVAs. MSVC /MAP is linker metadata, not a new
          # runtime code path. Never print absolute virtual addresses,
          # stack contents, credentials, SDP, or a complete symbol table.
          if ("${{ matrix.platform }}" -eq "Windows" -and
              $env:TURBOMEDIA_CI_HEAD_REF -eq "fix/dc-channel-callback-leases-195") {
            $mapJobs = @(
              @{ module = "datachannel"
                 file = (Join-Path $build "turbo_media_datachannel.map")
                 rvas = @(142375, 127190, 54509, 49664, 16946) },
              @{ module = "webrtc"
                 file = (Join-Path $build "turbo_media_webrtc.map")
                 rvas = @(18106, 35948) }
            )
            foreach ($job in $mapJobs) {
              if (-not (Test-Path -LiteralPath $job.file -PathType Leaf)) {
                throw "Required Windows private symbol map missing for $($job.module)"
              }
              $preferred = [UInt64]0
              $symbols = [System.Collections.Generic.List[object]]::new()
              foreach ($mapLine in [IO.File]::ReadLines($job.file)) {
                if ($mapLine -match 'Preferred load address is\s+([0-9a-fA-F]+)') {
                  $preferred = [Convert]::ToUInt64($Matches[1], 16)
                }
                if ($mapLine -match '^\s*[0-9a-fA-F]{4}:[0-9a-fA-F]{8,16}\s+(\S+)\s+([0-9a-fA-F]{8,16})\s+f\s+') {
                  $symbols.Add(@{name=$Matches[1]; va=[Convert]::ToUInt64($Matches[2],16)})
                }
              }
              if ($preferred -eq 0 -or $symbols.Count -eq 0) {
                throw "Missing public code symbols in $($job.module) link map"
              }
              foreach ($rva in $job.rvas) {
                $closest = $null
                $nearestRva = [UInt64]0
                foreach ($sym in $symbols) {
                  if ($sym.va -lt $preferred) { continue }
                  $symbolRva = $sym.va - $preferred
                  if ($symbolRva -le [UInt64]$rva -and
                      ($null -eq $closest -or $symbolRva -gt $nearestRva)) {
                    $closest = $sym
                    $nearestRva = $symbolRva
                  }
                }
                if ($closest) {
                  $safe = [string]$closest.name -replace '[^A-Za-z0-9_@.?$:-]', '_'
                  $within = [UInt64]$rva - $nearestRva
                  Write-Host "[stack-symbol] module=$($job.module) rva=$rva symbol=$safe offset=$within"
                } else {
                  Write-Host "[stack-symbol] module=$($job.module) rva=$rva symbol=unknown offset=0"
                }
              }
            }
          }
          & ccache --show-stats
          if ($LASTEXITCODE -ne 0) { throw "ccache stats failed" }
          if ("${{ matrix.platform }}" -ne "Android") {
            # Parallelize independent tests only on Windows. CTest honors
            # RUN_SERIAL on the real WHIP/SFU restart test and existing
            # RESOURCE_LOCK properties on tests sharing fixed ports.
            # Never overlap SFU generation shutdown/restart with another test.
            if ("${{ matrix.platform }}" -eq "Windows") {
              & ctest --preset ci-platform-test --parallel 4
            } else {
              & ctest --preset ci-platform-test
            }
            if ($LASTEXITCODE -ne 0) { throw "CTest failed for ${{ matrix.platform }}" }
            # Diagnose #191 with 50 independent E2E processes to exercise
            # callback/Owner teardown under real Windows scheduling.
            # First crash fails immediately; no passes after failure can hide it.
            # This is independent from the dead-SFU WHIP teardown gate below.
            if ("${{ matrix.platform }}" -eq "Windows" -and
                $env:TURBOMEDIA_CI_HEAD_REF -in @("diagnostics/whip-sfu-restart-windows", "fix/dc-channel-callback-leases-195", "fix/sctp-status-close-drain-198", "feature/sctp-native-operation-owner-201", "test/sctp-late-comm-up-red-201", "fix/sctp-comm-up-native-owner-201", "test/sctp-channel-reset-close-red-201", "fix/sctp-channel-reset-owner-201", "test/sctp-native-owner-consolidated-201", "test/sctp-manual-timer-elapsed-red-208", "fix/sctp-monotonic-timer-pump-208", "test/sctp-timer-reentrant-callback-208", "test/sctp-real-timer-foreign-close-208")) {
              & ctest --preset ci-platform-test -R "^turbo_media_test_webrtc_e2e$" --repeat "until-fail:50" --output-on-failure --timeout 90
              if ($LASTEXITCODE -ne 0) {
                throw "Windows WebRTC ICE E2E repeat conformance failed"
              }
            }
            # Draft diagnostics only: two additional source-identical real
            # SFU restarts must both pass. No skipped tests, wider production
            # deadlines, application replay or automatic settlement retry.
            if ("${{ matrix.platform }}" -eq "Windows" -and
                $env:TURBOMEDIA_CI_HEAD_REF -in @("diagnostics/whip-sfu-restart-windows", "fix/dc-channel-callback-leases-195", "fix/sctp-status-close-drain-198", "feature/sctp-native-operation-owner-201", "test/sctp-late-comm-up-red-201", "fix/sctp-comm-up-native-owner-201", "test/sctp-channel-reset-close-red-201", "fix/sctp-channel-reset-owner-201", "test/sctp-native-owner-consolidated-201", "test/sctp-manual-timer-elapsed-red-208", "fix/sctp-monotonic-timer-pump-208", "test/sctp-timer-reentrant-callback-208", "test/sctp-real-timer-foreign-close-208")) {
              $peerDestroyStageCount = 0
              $whepPeerDestroyMs = [System.Collections.Generic.List[long]]::new()
              # CTest normally hides successful test stdout. Capture only the
              # schema-validated numeric timing and redacted failure counters;
              # never print verbose SFU/SDP, Authorization or raw test logs.
              & ctest --preset ci-platform-test -R "^test_ivr_whip_transport$" --repeat "until-fail:2" --output-on-failure --timeout 180 -V 2>&1 |
                ForEach-Object {
                  $line = [string]$_
                  if ($line -match '\[whip-restart-timing\] initial_ms=\d+ shutdown_ms=\d+ terminal_ms=\d+ restart_ms=\d+ whip_ms=\d+ whep_ms=\d+ rtp_ms=\d+') {
                    Write-Host $Matches[0]
                  } elseif ($line -match '\[whip-restart-subtiming\] whip_terminal_ms=\d+ whep_terminal_ms=\d+ whep_stop_ms=\d+ whip_stop_ms=\d+ spawn_ms=\d+ room_ms=\d+') {
                    Write-Host $Matches[0]
                  } elseif ($line -match '\[whip-restart-terminal-events\] whip_since_kill_ms=\d+ whep_since_kill_ms=\d+') {
                    Write-Host $Matches[0]
                  } elseif ($line -match '\[peer-destroy-stage\] admission_ms=\d+ ice_close_ms=\d+ ice_worker_ms=\d+ callbacks_ms=\d+ media_ms=\d+ dc_peer_ms=\d+ ice_owner_ms=\d+ dc_context_ms=\d+ sync_ms=\d+ strings_ms=\d+ total_ms=\d+') {
                    # Emit only numeric durations, never SDP, peer IDs or Authorization.
                    Write-Host $Matches[0]
                    $peerDestroyStageCount++
                  } elseif ($line -match '\[ivr-stop-stage\] transport=(?:whip|whep) join_ms=\d+ delete_ms=\d+ peer_destroy_ms=\d+ result=-?\d+') {
                    # Redact by schema: only stop-phase numeric counters are
                    # printed, never HTTP locations, SDP or bearer tokens.
                    $safeStopLine = $Matches[0]
                    Write-Host $safeStopLine
                    if ($safeStopLine -match '\[ivr-stop-stage\] transport=whep join_ms=\d+ delete_ms=\d+ peer_destroy_ms=(\d+) result=-?\d+') {
                      $whepPeerDestroyMs.Add([long]$Matches[1])
                    }
                  } elseif ($line -match '\[whip-restart\] stage=(?:initial-whip|initial-whep|initial-rtp|post-sfu-restart|post-sfu-restart-whep|post-sfu-restart-rtp|post-sfu-stop-whip-terminal|post-sfu-stop-whep-terminal|post-sfu-restart-room) sfu_generation=\d+ child_alive=[01] whip_connected_now=[01] whep_connected_now=[01] whip_states=\{connecting:\d+,connected:\d+,disconnected:\d+,failed:\d+,closed:\d+,identity_invalid:\d+,attempt:\d+,state:-?\d+,error:-?\d+\} whep_states=\{connecting:\d+,connected:\d+,disconnected:\d+,failed:\d+,closed:\d+,identity_invalid:\d+,attempt:\d+,state:-?\d+,error:-?\d+\} child_log_lines=\d+ ice=\d+ dtls=\d+ errors=\d+') {
                    # Only the schema-validated, token-free counters can escape.
                    Write-Host $Matches[0]
                  } elseif ($line -match '\[sfu-log-summary\] available=[01] chunks=\d+ ice=\d+ dtls=\d+ errors=\d+') {
                    Write-Host $Matches[0]
                  } elseif ($line -match '\[sfu-provision\] attach_failed=1 attempts=10 status_class=[0-5]') {
                    Write-Host $Matches[0]
                  }
                }
              if ($LASTEXITCODE -ne 0) {
                throw "Windows SFU/WHIP restart repeatability gate failed"
              }
              if ($peerDestroyStageCount -lt 4) {
                throw "Windows SFU/WHIP peer destruction phase diagnostics missing"
              }
              # SaltsNet #53: active ICE Owner checks must drain without waiting
              # for their 12s connectivity deadline after close admission.
              # Preserve RFC 7675 consent and the ordinary HTTP DELETE result.
              if ($whepPeerDestroyMs.Count -ne 2) {
                throw "Windows WHEP teardown duration evidence missing"
              }
              foreach ($durationMs in $whepPeerDestroyMs) {
                if ($durationMs -gt 2000) {
                  throw "Windows WHEP ICE Owner shutdown exceeded 2s teardown gate"
                }
              }
            }
          }

      # Separate test-only build: compile TurboMedia wrappers with ASan/UBSan
      # against the same exact installed candidate SDK graph. Build targets,
      # test selection and sanitizer flags are CMake Preset owned.
      - name: Linux ACE owner ASan and UBSan
        if: >-
          matrix.platform == 'Linux' &&
          github.event_name == 'pull_request' &&
          (github.head_ref == 'fix/http-flv-owner-drain-recovery' ||
           github.head_ref == 'diagnostics/whip-sfu-restart-windows' ||
           github.head_ref == 'diagnostics/dc-channel-close-red-195' ||
           github.head_ref == 'fix/dc-channel-callback-leases-195' ||
           github.head_ref == 'fix/sctp-status-close-drain-198' ||
           github.head_ref == 'feature/sctp-native-operation-owner-201' ||
           github.head_ref == 'test/sctp-late-comm-up-red-201' ||
           github.head_ref == 'fix/sctp-comm-up-native-owner-201' ||
           github.head_ref == 'test/sctp-channel-reset-close-red-201' ||
           github.head_ref == 'fix/sctp-channel-reset-owner-201' ||
           github.head_ref == 'test/sctp-native-owner-consolidated-201' ||
           github.head_ref == 'test/sctp-manual-timer-elapsed-red-208' ||
           github.head_ref == 'fix/sctp-monotonic-timer-pump-208' ||
           github.head_ref == 'test/sctp-timer-reentrant-callback-208' ||
           github.head_ref == 'test/sctp-real-timer-foreign-close-208')
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $runtimeDirs = @()
          foreach ($name in @("SALTS_ROOT", "SALTS_UTILS_ROOT", "SALTSNET_ROOT", "CHTTP_ROOT", "RULES_FORGE_ROOT")) {
            $root = [Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrWhiteSpace($root)) { continue }
            foreach ($leaf in @("bin", "lib")) {
              $candidate = Join-Path $root $leaf
              if (Test-Path -LiteralPath $candidate -PathType Container) { $runtimeDirs += $candidate }
            }
          }
          $vcpkgRuntime = Join-Path $env:GITHUB_WORKSPACE "vcpkg_installed/${{ matrix.triplet }}"
          foreach ($leaf in @("bin", "lib")) {
            $candidate = Join-Path $vcpkgRuntime $leaf
            if (Test-Path -LiteralPath $candidate -PathType Container) { $runtimeDirs += $candidate }
          }
          $parts = @($runtimeDirs)
          if (-not [string]::IsNullOrWhiteSpace($env:LD_LIBRARY_PATH)) { $parts += $env:LD_LIBRARY_PATH }
          $env:LD_LIBRARY_PATH = $parts -join [IO.Path]::PathSeparator
          $env:ASAN_OPTIONS = "detect_leaks=1:halt_on_error=1:abort_on_error=1"
          $env:UBSAN_OPTIONS = "halt_on_error=1:print_stacktrace=1"
          & cmake --preset ci-platform-linux-asan-ubsan
          if ($LASTEXITCODE -ne 0) { throw "Linux ACE ASan/UBSan configure failed" }
          & cmake --build --preset ci-platform-linux-asan-ubsan-build
          if ($LASTEXITCODE -ne 0) { throw "Linux ACE ASan/UBSan build failed" }
          & ctest --preset ci-platform-linux-asan-ubsan
          if ($LASTEXITCODE -ne 0) { throw "Linux ACE ASan/UBSan native tests failed" }

      # Fault-injection tests exercise the CI build, never the installed SDK.
      # Rebuild and retest with injection disabled before installation.
      # Android omits streamer and the HTTP-FLV test-only hook. Avoid
      # reconfiguring the exact native cross-build without its NDK args.
      - name: Qualify production library without test fault injection
        if: matrix.platform != 'Android'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & cmake --preset ci-platform-release "-DTURBO_MEDIA_TEST_FAULT_INJECTION:BOOL=OFF"
          if ($LASTEXITCODE -ne 0) { throw "production configure failed for ${{ matrix.platform }}" }
          $build = Join-Path $env:GITHUB_WORKSPACE "build/ci-platform"
          $cache = Join-Path $build "CMakeCache.txt"
          if (-not (Select-String -LiteralPath $cache -Pattern "^TURBO_MEDIA_TEST_FAULT_INJECTION:BOOL=OFF$" -Quiet)) {
            throw "production build still enables HTTP-FLV fault injection"
          }
          & cmake --build --preset ci-platform-build
          if ($LASTEXITCODE -ne 0) { throw "production build failed for ${{ matrix.platform }}" }
          # A distinct GitHub Actions step does not retain the first CTest's
          # DYLD_LIBRARY_PATH/LD_LIBRARY_PATH/PATH. Restore the exact installed
          # SDK and vcpkg runtime locations before the production CTest gate.
          $runtimeDirs = @()
          foreach ($name in @("SALTS_ROOT", "SALTS_UTILS_ROOT", "SALTSNET_ROOT", "CHTTP_ROOT", "RULES_FORGE_ROOT")) {
            $root = [Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrWhiteSpace($root)) { continue }
            foreach ($leaf in @("bin", "lib")) {
              $candidate = Join-Path $root $leaf
              if (Test-Path -LiteralPath $candidate -PathType Container) {
                $runtimeDirs += $candidate
              }
            }
          }
          $vcpkgRuntime = Join-Path $env:GITHUB_WORKSPACE "vcpkg_installed/${{ matrix.triplet }}"
          foreach ($leaf in @("bin", "lib")) {
            $candidate = Join-Path $vcpkgRuntime $leaf
            if (Test-Path -LiteralPath $candidate -PathType Container) {
              $runtimeDirs += $candidate
            }
          }
          if ($IsWindows) {
            $env:PATH = ($runtimeDirs + $env:PATH) -join [IO.Path]::PathSeparator
          } elseif ($IsMacOS) {
            $parts = @($runtimeDirs)
            if (-not [string]::IsNullOrWhiteSpace($env:DYLD_LIBRARY_PATH)) { $parts += $env:DYLD_LIBRARY_PATH }
            $env:DYLD_LIBRARY_PATH = $parts -join [IO.Path]::PathSeparator
          } else {
            $parts = @($runtimeDirs)
            if (-not [string]::IsNullOrWhiteSpace($env:LD_LIBRARY_PATH)) { $parts += $env:LD_LIBRARY_PATH }
            $env:LD_LIBRARY_PATH = $parts -join [IO.Path]::PathSeparator
          }
          # The first pass already exercises the entire native graph, including
          # Windows WHIP/SFU. Only Streamer/HTTP is requalified after disabling
          # fault injection; never install the instrumented test library.
          & ctest --preset ci-platform-production-contract
          if ($LASTEXITCODE -ne 0) { throw "production HTTP-FLV CTest failed for ${{ matrix.platform }}" }

      - name: Install
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $build = Join-Path $env:GITHUB_WORKSPACE "build/ci-platform"
          $stage = Join-Path $env:GITHUB_WORKSPACE "stage/ci-platform"
          & cmake --install $build
          if ($LASTEXITCODE -ne 0) { throw "install failed for ${{ matrix.platform }}" }
          $config = Join-Path $stage "lib/cmake/TurboMedia/TurboMediaConfig.cmake"
          if (-not (Test-Path -LiteralPath $config -PathType Leaf)) {
            throw "missing installed TurboMediaConfig.cmake"
          }
          if (Select-String -LiteralPath $config -SimpleMatch "TurboMedia_PRODUCT") {
            throw "installed package still exposes obsolete product identity"
          }
