name: StreamGraph native FFmpeg decode provider

'on':
  push:
    paths:
      - 'streamgraph/**'
      - '.github/workflows/streamgraph-ffmpeg-provider.yml'
  pull_request:
    paths:
      - 'streamgraph/**'
      - '.github/workflows/streamgraph-ffmpeg-provider.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-decoder:
    name: Real MJPEG decoder into CPU StreamGraph (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [native, asan-ubsan, tsan]
    steps:
      - uses: actions/checkout@v4
      - name: Install desktop libavcodec development dependencies
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libavcodec-dev libavutil-dev pkg-config ninja-build
          pkg-config --modversion libavcodec libavutil
      - name: Configure and compile real FFmpeg Provider
        shell: bash
        run: |
          set -euo pipefail
          opts=()
          if [ "${{ matrix.mode }}" = "asan-ubsan" ]; then
            opts+=(-DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer")
            opts+=(-DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined")
            opts+=(-DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined")
          elif [ "${{ matrix.mode }}" = "tsan" ]; then
            opts+=(-DCMAKE_C_FLAGS="-fsanitize=thread -fno-omit-frame-pointer")
            opts+=(-DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer")
            opts+=(-DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread")
            opts+=(-DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=thread")
          fi
          cmake -S streamgraph -B "streamgraph/build/ffmpeg-${{ matrix.mode }}" -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DTM_STREAMGRAPH_ENABLE_FFMPEG_PROVIDER=ON \
            "${opts[@]}"
          cmake --build "streamgraph/build/ffmpeg-${{ matrix.mode }}" \
            --target streamgraph_ffmpeg_decode_test streamgraph_ffmpeg_async_test
      - name: Independently install and consume FFmpeg adapter SDK
        shell: bash
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/streamgraph-ffmpeg-sdk"
          cmake --install "streamgraph/build/ffmpeg-${{ matrix.mode }}" --prefix "$prefix"
          test -f "$prefix/include/turbo_streamgraph_ffmpeg.h"
          test -f "$prefix/lib/cmake/TurboMediaStreamGraphFFmpeg/TurboMediaStreamGraphFFmpegConfig.cmake"
          cmake_opts=(
            -S streamgraph/adapters/ffmpeg/tests/install_consumer
            -B "$RUNNER_TEMP/ffmpeg-independent-${{ matrix.mode }}"
            -G Ninja
            -DCMAKE_PREFIX_PATH="$prefix"
            -DCMAKE_FIND_USE_PACKAGE_REGISTRY=FALSE
            -DCMAKE_FIND_USE_SYSTEM_PACKAGE_REGISTRY=FALSE
          )
          if [ "${{ matrix.mode }}" = "asan-ubsan" ]; then
            cmake_opts+=(-DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer")
            cmake_opts+=(-DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer")
            cmake_opts+=(-DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined")
            export ASAN_OPTIONS=detect_leaks=1
          elif [ "${{ matrix.mode }}" = "tsan" ]; then
            cmake_opts+=(-DCMAKE_C_FLAGS="-fsanitize=thread -fno-omit-frame-pointer")
            cmake_opts+=(-DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer")
            cmake_opts+=(-DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread")
          fi
          cmake "${cmake_opts[@]}"
          cmake --build "$RUNNER_TEMP/ffmpeg-independent-${{ matrix.mode }}"
          ctest --test-dir "$RUNNER_TEMP/ffmpeg-independent-${{ matrix.mode }}" \
            --no-tests=error --output-on-failure --timeout 60
      - name: Test owner decoded-frame lifetime, QoS and EOF
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.mode }}" = "asan-ubsan" ]; then export ASAN_OPTIONS=detect_leaks=1; fi
          ctest --test-dir "streamgraph/build/ffmpeg-${{ matrix.mode }}" \
            -R 'streamgraph_ffmpeg_' --no-tests=error --output-on-failure --timeout 60
