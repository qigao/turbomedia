name: Client Released SDK

on:
  pull_request:
    paths:
      - ".github/workflows/linux-client-released-sdk.yml"
      - "CMakeLists.txt"
      - "cmake/**"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
      - "vcpkg-overlays/**"
      - "common/**"
      - "core/**"
      - "crypto/**"
      - "speech/**"
      - "codec/**"
      - "muxer/**"
      - "demuxer/**"
      - "network/**"
      - "transport/**"
      - "player/**"
      - "client_processing/**"
      - "recognition/**"
      - "media/**"
      - "webrtc/**"
      - "tests/**"
  push:
    branches: [master]
    paths:
      - ".github/workflows/linux-client-released-sdk.yml"
      - "CMakeLists.txt"
      - "cmake/**"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
      - "vcpkg-overlays/**"
      - "common/**"
      - "core/**"
      - "crypto/**"
      - "speech/**"
      - "codec/**"
      - "muxer/**"
      - "demuxer/**"
      - "network/**"
      - "transport/**"
      - "player/**"
      - "client_processing/**"
      - "recognition/**"
      - "media/**"
      - "webrtc/**"
      - "tests/**"

permissions:
  contents: read
  packages: read

concurrency:
  group: client-released-sdk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Linux CLIENT released-SDK contract
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read

      - uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@master

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Prepare build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             ninja-build pkg-config nasm             libpipewire-0.3-dev libx11-dev libxext-dev

      - name: Restore released Salts ecosystem SDKs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/turbomedia-linux-client.config"
          project="$RUNNER_TEMP/turbomedia-linux-client.csproj"
          packages="$RUNNER_TEMP/turbomedia-linux-client-packages"
          printf '<configuration><packageSources><clear /></packageSources></configuration>\n' > "$config"
          dotnet nuget add source https://nuget.pkg.github.com/qigao/index.json             --name github --username qigao --password "$GITHUB_TOKEN"             --store-password-in-clear-text --configfile "$config"
          cat > "$project" <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><TargetFramework>net8.0</TargetFramework></PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Salts.Native" Version="*" />
              <PackageReference Include="SaltsUtils.Native" Version="*" />
              <PackageReference Include="SaltsNet.Native" Version="*" />
              <PackageReference Include="CHttp.Native" Version="*" />
            </ItemGroup>
          </Project>
          EOF
          dotnet restore "$project" --configfile "$config" --packages "$packages"
          resolve_sdk_root() {
            local package_id="$1"
            local package_root="$packages/$package_id"
            local matches=()
            mapfile -t matches < <(find "$package_root" -mindepth 1 -maxdepth 1 -type d -print)
            if [ "${#matches[@]}" -ne 1 ]; then
              printf 'expected exactly one restored version for %s, found %s\n'                 "$package_id" "${#matches[@]}" >&2
              return 1
            fi
            printf '%s/sdk/linux-x64\n' "${matches[0]}"
          }
          echo "SALTS_ROOT=$(resolve_sdk_root salts.native)" >> "$GITHUB_ENV"
          echo "SALTS_UTILS_ROOT=$(resolve_sdk_root saltsutils.native)" >> "$GITHUB_ENV"
          echo "SALTSNET_ROOT=$(resolve_sdk_root saltsnet.native)" >> "$GITHUB_ENV"
          echo "CHTTP_ROOT=$(resolve_sdk_root chttp.native)" >> "$GITHUB_ENV"

      - name: Verify released SDK contracts
        shell: bash
        run: |
          set -euo pipefail
          test -f "$SALTS_ROOT/lib/cmake/Salts/SaltsConfig.cmake"
          test -f "$SALTS_UTILS_ROOT/lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake"
          test -f "$SALTSNET_ROOT/lib/cmake/SaltsNet/SaltsNetConfig.cmake"
          test -f "$CHTTP_ROOT/lib/cmake/Chttp/ChttpConfig.cmake"
          test -f "$SALTS_UTILS_ROOT/include/salts_capture.h"
          test -f "$SALTS_UTILS_ROOT/include/salts_playback.h"
          # TurboMedia's own configure remains the canonical imported-target check:
          # CLIENT requires Salts::Capture and Salts::Playback.

      - name: Restore TurboMedia vcpkg dependencies cache-only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf vcpkg_installed
          "$VCPKG_ROOT/vcpkg" install             --x-manifest-root=.             --x-install-root="$GITHUB_WORKSPACE/vcpkg_installed"             --triplet x64-linux             --only-binarycaching

      - name: Configure Linux CLIENT
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/linux-client-sdk stage/linux-client
          cmake -S . -B build/linux-client-sdk -G Ninja             -DCMAKE_BUILD_TYPE=Release             -DTURBO_MEDIA_PRODUCT=CLIENT             -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE"             -DVCPKG_TARGET_TRIPLET=x64-linux             -DVCPKG_MANIFEST_MODE=OFF             -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed"             -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/stage/linux-client"

      - name: Build and test Linux CLIENT
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$SALTSNET_ROOT/lib:$SALTS_UTILS_ROOT/lib:$SALTS_ROOT/lib:$GITHUB_WORKSPACE/vcpkg_installed/x64-linux/lib:${LD_LIBRARY_PATH:-}"
          cmake --build build/linux-client-sdk --parallel 2
          ctest --test-dir build/linux-client-sdk --no-tests=error --output-on-failure

      - name: Install Linux CLIENT
        shell: bash
        run: |
          set -euo pipefail
          cmake --install build/linux-client-sdk
          test -f "$GITHUB_WORKSPACE/stage/linux-client/lib/cmake/TurboMedia/TurboMediaConfig.cmake"
          grep -F 'set(TurboMedia_PRODUCT "CLIENT")'             "$GITHUB_WORKSPACE/stage/linux-client/lib/cmake/TurboMedia/TurboMediaConfig.cmake"

      - name: Build fresh installed-package consumer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/linux-client-consumer
          cmake -S tests/package_consumer -B build/linux-client-consumer -G Ninja             -DCMAKE_BUILD_TYPE=Release             -DTurboMedia_EXPECTED_PRODUCT=CLIENT             -DTurboMedia_DIR="$GITHUB_WORKSPACE/stage/linux-client/lib/cmake/TurboMedia"             -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE"             -DVCPKG_TARGET_TRIPLET=x64-linux             -DVCPKG_MANIFEST_MODE=OFF             -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed"
          cmake --build build/linux-client-consumer --parallel 2


  windows-client:
    name: Windows CLIENT released-SDK contract
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read

      - uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@master

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Prepare build tools and MSVC environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install ninja nasm strawberryperl -y --no-progress
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products "*" -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($vs)) {
            throw "x64 MSVC was not found"
          }
          $canonicalVcpkgRoot = $env:VCPKG_ROOT
          $vsdev = Join-Path $vs "Common7/Tools/VsDevCmd.bat"
          $command = 'call "' + $vsdev + '" -arch=x64 -host_arch=x64 >nul && set'
          $lines = & cmd.exe /d /s /c $command
          if ($LASTEXITCODE -ne 0) {
            throw "VsDevCmd failed"
          }
          foreach ($line in $lines) {
            if ($line -match '^([^=]+)=(.*)$') {
              "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }
          "VCPKG_ROOT=$canonicalVcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore released Salts ecosystem SDKs
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $config = Join-Path $env:RUNNER_TEMP "turbomedia-windows-client.config"
          $project = Join-Path $env:RUNNER_TEMP "turbomedia-windows-client.csproj"
          $packages = Join-Path $env:RUNNER_TEMP "turbomedia-windows-client-packages"
          '<configuration><packageSources><clear /></packageSources></configuration>' |
            Set-Content -LiteralPath $config -Encoding utf8
          dotnet nuget add source https://nuget.pkg.github.com/qigao/index.json `
            --name github --username qigao --password $env:GITHUB_TOKEN `
            --store-password-in-clear-text --configfile $config
          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><TargetFramework>net8.0</TargetFramework></PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Salts.Native" Version="*" />
              <PackageReference Include="SaltsUtils.Native" Version="*" />
              <PackageReference Include="SaltsNet.Native" Version="*" />
              <PackageReference Include="CHttp.Native" Version="*" />
            </ItemGroup>
          </Project>
          '@ | Set-Content -LiteralPath $project -Encoding utf8
          dotnet restore $project --configfile $config --packages $packages
          if ($LASTEXITCODE -ne 0) { throw "NuGet restore failed" }

          function Resolve-SdkRoot([string]$packageId) {
            $packageRoot = Join-Path $packages $packageId
            $matches = @(Get-ChildItem -LiteralPath $packageRoot -Directory)
            if ($matches.Count -ne 1) {
              throw "expected exactly one restored version for $packageId, found $($matches.Count)"
            }
            return (Join-Path $matches[0].FullName "sdk/windows-x64").Replace('\', '/')
          }

          "SALTS_ROOT=$(Resolve-SdkRoot 'salts.native')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SALTS_UTILS_ROOT=$(Resolve-SdkRoot 'saltsutils.native')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SALTSNET_ROOT=$(Resolve-SdkRoot 'saltsnet.native')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CHTTP_ROOT=$(Resolve-SdkRoot 'chttp.native')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify released SDK contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($file in @(
            (Join-Path $env:SALTS_ROOT "lib/cmake/Salts/SaltsConfig.cmake"),
            (Join-Path $env:SALTS_UTILS_ROOT "lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake"),
            (Join-Path $env:SALTSNET_ROOT "lib/cmake/SaltsNet/SaltsNetConfig.cmake"),
            (Join-Path $env:CHTTP_ROOT "lib/cmake/Chttp/ChttpConfig.cmake"),
            (Join-Path $env:SALTS_UTILS_ROOT "include/salts_capture.h"),
            (Join-Path $env:SALTS_UTILS_ROOT "include/salts_playback.h")
          )) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "missing released SDK contract: $file"
            }
          }
          foreach ($dir in @(
            (Join-Path $env:SALTS_ROOT "bin"),
            (Join-Path $env:SALTS_UTILS_ROOT "bin"),
            (Join-Path $env:SALTSNET_ROOT "bin"),
            (Join-Path $env:CHTTP_ROOT "bin"),
            (Join-Path $env:GITHUB_WORKSPACE "vcpkg_installed/x64-windows/bin")
          )) {
            $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Restore TurboMedia vcpkg dependencies cache-only
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installed = Join-Path $env:GITHUB_WORKSPACE "vcpkg_installed"
          if (Test-Path -LiteralPath $installed) {
            Remove-Item -LiteralPath $installed -Recurse -Force
          }
          & "$env:VCPKG_ROOT/vcpkg.exe" install `
            --x-manifest-root=. `
            "--x-install-root=$installed" `
            --triplet x64-windows `
            --only-binarycaching
          if ($LASTEXITCODE -ne 0) { throw "cache-only vcpkg restore failed" }

      - name: Configure Windows CLIENT
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $build = Join-Path $env:GITHUB_WORKSPACE "build/windows-client-sdk"
          $stage = Join-Path $env:GITHUB_WORKSPACE "stage/windows-client"
          Remove-Item -LiteralPath $build -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $stage -Recurse -Force -ErrorAction SilentlyContinue
          & cmake -S . -B $build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DTURBO_MEDIA_PRODUCT=CLIENT `
            "-DCMAKE_TOOLCHAIN_FILE=$env:QIGAO_VCPKG_TOOLCHAIN_FILE" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DVCPKG_MANIFEST_MODE=OFF `
            "-DVCPKG_INSTALLED_DIR=$env:GITHUB_WORKSPACE/vcpkg_installed" `
            "-DCMAKE_INSTALL_PREFIX=$stage"
          if ($LASTEXITCODE -ne 0) { throw "Windows CLIENT configure failed" }

      - name: Build and test Windows CLIENT
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $build = Join-Path $env:GITHUB_WORKSPACE "build/windows-client-sdk"
          & cmake --build $build --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Windows CLIENT build failed" }
          & ctest --test-dir $build --no-tests=error --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "Windows CLIENT CTest failed" }

      - name: Install Windows CLIENT
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $build = Join-Path $env:GITHUB_WORKSPACE "build/windows-client-sdk"
          $stage = Join-Path $env:GITHUB_WORKSPACE "stage/windows-client"
          & cmake --install $build
          if ($LASTEXITCODE -ne 0) { throw "Windows CLIENT install failed" }
          $config = Join-Path $stage "lib/cmake/TurboMedia/TurboMediaConfig.cmake"
          if (-not (Test-Path -LiteralPath $config -PathType Leaf)) {
            throw "missing installed TurboMediaConfig.cmake"
          }
          if (-not (Select-String -LiteralPath $config -SimpleMatch 'set(TurboMedia_PRODUCT "CLIENT")')) {
            throw "installed package did not preserve CLIENT product identity"
          }

      - name: Build fresh installed-package consumer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $consumer = Join-Path $env:GITHUB_WORKSPACE "build/windows-client-consumer"
          $stage = Join-Path $env:GITHUB_WORKSPACE "stage/windows-client"
          Remove-Item -LiteralPath $consumer -Recurse -Force -ErrorAction SilentlyContinue
          & cmake -S tests/package_consumer -B $consumer -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DTurboMedia_EXPECTED_PRODUCT=CLIENT `
            "-DTurboMedia_DIR=$stage/lib/cmake/TurboMedia" `
            "-DCMAKE_TOOLCHAIN_FILE=$env:QIGAO_VCPKG_TOOLCHAIN_FILE" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DVCPKG_MANIFEST_MODE=OFF `
            "-DVCPKG_INSTALLED_DIR=$env:GITHUB_WORKSPACE/vcpkg_installed"
          if ($LASTEXITCODE -ne 0) { throw "Windows CLIENT consumer configure failed" }
          & cmake --build $consumer --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Windows CLIENT consumer build failed" }
