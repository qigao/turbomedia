name: Native SDK

on:
  pull_request:
    paths:
      - ".github/workflows/native-sdk.yml"
      - "cmake/ci/restore-turbomedia-native-sdks.ps1"
      - "CMakeLists.txt"
      - "cmake/**"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
      - "vcpkg-overlays/**"
      - "common/**"
      - "core/**"
      - "crypto/**"
      - "speech/**"
      - "codec/**"
      - "muxer/**"
      - "demuxer/**"
      - "network/**"
      - "transport/**"
      - "player/**"
      - "client_processing/**"
      - "recognition/**"
      - "media/**"
      - "server/**"
      - "streamer/**"
      - "pipeline/**"
      - "webrtc/**"
      - "tests/**"
  push:
    branches: [master]
    paths:
      - ".github/workflows/native-sdk.yml"
      - "cmake/ci/restore-turbomedia-native-sdks.ps1"
      - "CMakeLists.txt"
      - "cmake/**"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
      - "vcpkg-overlays/**"
      - "common/**"
      - "core/**"
      - "crypto/**"
      - "speech/**"
      - "codec/**"
      - "muxer/**"
      - "demuxer/**"
      - "network/**"
      - "transport/**"
      - "player/**"
      - "client_processing/**"
      - "recognition/**"
      - "media/**"
      - "server/**"
      - "streamer/**"
      - "pipeline/**"
      - "webrtc/**"
      - "tests/**"

permissions:
  contents: read
  packages: read

concurrency:
  group: native-sdk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.platform }} ${{ matrix.product }} released-SDK contract
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: Linux
            rid: linux-x64
            triplet: x64-linux
            product: CLIENT
          - os: windows-2022
            platform: Windows
            rid: windows-x64
            triplet: x64-windows
            product: CLIENT
          - os: ubuntu-24.04
            platform: Linux
            rid: linux-x64
            triplet: x64-linux
            product: SERVER
          - os: windows-2022
            platform: Windows
            rid: windows-x64
            triplet: x64-windows
            product: SERVER

    steps:
      - uses: actions/checkout@v4

      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read

      - uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@master

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Prepare Linux build tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             ninja-build pkg-config nasm autoconf automake libtool             libpipewire-0.3-dev libx11-dev libxext-dev

      - name: Prepare Windows build tools and MSVC environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install ninja nasm strawberryperl -y --no-progress
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products "*" -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($vs)) {
            throw "x64 MSVC was not found"
          }
          $canonicalVcpkgRoot = $env:VCPKG_ROOT
          $vsdev = Join-Path $vs "Common7/Tools/VsDevCmd.bat"
          $command = 'call "' + $vsdev + '" -arch=x64 -host_arch=x64 >nul && set'
          $lines = & cmd.exe /d /s /c $command
          if ($LASTEXITCODE -ne 0) { throw "VsDevCmd failed" }
          foreach ($line in $lines) {
            if ($line -match '^([^=]+)=(.*)$') {
              "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }
          "VCPKG_ROOT=$canonicalVcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore released native SDKs
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./cmake/ci/restore-turbomedia-native-sdks.ps1 -Rid "${{ matrix.rid }}" -Product "${{ matrix.product }}"

      - name: Restore TurboMedia vcpkg dependencies cache-only
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installed = Join-Path $env:GITHUB_WORKSPACE "vcpkg_installed"
          Remove-Item -LiteralPath $installed -Recurse -Force -ErrorAction SilentlyContinue
          $vcpkg = Join-Path $env:VCPKG_ROOT $(if ($IsWindows) { "vcpkg.exe" } else { "vcpkg" })
          & $vcpkg install "--x-manifest-root=." "--x-install-root=$installed" "--triplet=${{ matrix.triplet }}" --only-binarycaching
          if ($LASTEXITCODE -ne 0) { throw "cache-only vcpkg restore failed" }

      - name: Configure ${{ matrix.platform }} ${{ matrix.product }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $name = "${{ matrix.platform }}-${{ matrix.product }}".ToLowerInvariant()
          $build = Join-Path $env:GITHUB_WORKSPACE "build/native-$name"
          $stage = Join-Path $env:GITHUB_WORKSPACE "stage/native-$name"
          $installed = Join-Path $env:GITHUB_WORKSPACE "vcpkg_installed"
          Remove-Item -LiteralPath $build -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $stage -Recurse -Force -ErrorAction SilentlyContinue
          $args = @(
            "-S", ".",
            "-B", $build,
            "-G", "Ninja",
            "-DCMAKE_BUILD_TYPE=Release",
            "-DTURBO_MEDIA_PRODUCT=${{ matrix.product }}",
            "-DCMAKE_TOOLCHAIN_FILE=$env:QIGAO_VCPKG_TOOLCHAIN_FILE",
            "-DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}",
            "-DVCPKG_MANIFEST_MODE=OFF",
            "-DVCPKG_INSTALLED_DIR=$installed",
            "-DCMAKE_INSTALL_PREFIX=$stage"
          )
          & cmake @args
          if ($LASTEXITCODE -ne 0) { throw "configure failed for $name" }

      - name: Build and test ${{ matrix.platform }} ${{ matrix.product }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $name = "${{ matrix.platform }}-${{ matrix.product }}".ToLowerInvariant()
          $build = Join-Path $env:GITHUB_WORKSPACE "build/native-$name"
          $depRoots = @(
            $env:SALTS_ROOT,
            $env:SALTS_UTILS_ROOT,
            $env:SALTSNET_ROOT,
            $env:CHTTP_ROOT
          )
          if ("${{ matrix.product }}" -eq "SERVER") {
            $depRoots += @(
              $env:RULES_FORGE_ROOT,
              $env:TURBODB_ROOT
            )
          }
          $runtimeDirs = @()
          foreach ($root in $depRoots) {
            foreach ($leaf in @("bin", "lib")) {
              $candidate = Join-Path $root $leaf
              if (Test-Path -LiteralPath $candidate -PathType Container) {
                $runtimeDirs += $candidate
              }
            }
          }
          $vcpkgRuntime = Join-Path $env:GITHUB_WORKSPACE "vcpkg_installed/${{ matrix.triplet }}"
          foreach ($leaf in @("bin", "lib")) {
            $candidate = Join-Path $vcpkgRuntime $leaf
            if (Test-Path -LiteralPath $candidate -PathType Container) {
              $runtimeDirs += $candidate
            }
          }
          if ($IsWindows) {
            $env:PATH = ($runtimeDirs + $env:PATH) -join [IO.Path]::PathSeparator
          } else {
            $current = $env:LD_LIBRARY_PATH
            $parts = @()
            $parts += $runtimeDirs
            if (-not [string]::IsNullOrWhiteSpace($current)) { $parts += $current }
            $env:LD_LIBRARY_PATH = $parts -join [IO.Path]::PathSeparator
          }
          & cmake --build $build --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "build failed for $name" }
          & ctest --test-dir $build --no-tests=error --output-on-failure -LE performance
          if ($LASTEXITCODE -ne 0) { throw "CTest failed for $name" }

      - name: Install ${{ matrix.platform }} ${{ matrix.product }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $name = "${{ matrix.platform }}-${{ matrix.product }}".ToLowerInvariant()
          $build = Join-Path $env:GITHUB_WORKSPACE "build/native-$name"
          $stage = Join-Path $env:GITHUB_WORKSPACE "stage/native-$name"
          & cmake --install $build
          if ($LASTEXITCODE -ne 0) { throw "install failed for $name" }
          $config = Join-Path $stage "lib/cmake/TurboMedia/TurboMediaConfig.cmake"
          if (-not (Test-Path -LiteralPath $config -PathType Leaf)) {
            throw "missing installed TurboMediaConfig.cmake"
          }
          $identity = 'set(TurboMedia_PRODUCT "${{ matrix.product }}")'
          if (-not (Select-String -LiteralPath $config -SimpleMatch $identity)) {
            throw "installed package product identity mismatch"
          }
          if ("${{ matrix.product }}" -eq "SERVER") {
            $legacy = Select-String -Path CMakeLists.txt,webrtc/apps/room_service/CMakeLists.txt,webrtc/apps/room_service/src/iris_orm_store.c -Pattern 'Orm::PostgreSQL|Orm_WITH_(SQLITE|POSTGRESQL)|orm_postgresql_connect'
            if ($legacy) { throw "legacy PostgreSQL ORM contract remains in SERVER" }
          }

      - name: Build fresh installed-package consumer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $name = "${{ matrix.platform }}-${{ matrix.product }}".ToLowerInvariant()
          $consumer = Join-Path $env:GITHUB_WORKSPACE "build/consumer-$name"
          $stage = Join-Path $env:GITHUB_WORKSPACE "stage/native-$name"
          $installed = Join-Path $env:GITHUB_WORKSPACE "vcpkg_installed"
          Remove-Item -LiteralPath $consumer -Recurse -Force -ErrorAction SilentlyContinue
          $args = @(
            "-S", "tests/package_consumer",
            "-B", $consumer,
            "-G", "Ninja",
            "-DCMAKE_BUILD_TYPE=Release",
            "-DTurboMedia_EXPECTED_PRODUCT=${{ matrix.product }}",
            "-DTurboMedia_DIR=$stage/lib/cmake/TurboMedia",
            "-DCMAKE_TOOLCHAIN_FILE=$env:QIGAO_VCPKG_TOOLCHAIN_FILE",
            "-DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}",
            "-DVCPKG_MANIFEST_MODE=OFF",
            "-DVCPKG_INSTALLED_DIR=$installed"
          )
          & cmake @args
          if ($LASTEXITCODE -ne 0) { throw "consumer configure failed for $name" }
          & cmake --build $consumer --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "consumer build failed for $name" }
