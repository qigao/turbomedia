name: Server Released SDK

on:
  pull_request:
    paths:
      - ".github/workflows/server-released-sdk.yml"
      - "CMakeLists.txt"
      - "cmake/**"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
      - "vcpkg-overlays/**"
      - "common/**"
      - "core/**"
      - "crypto/**"
      - "speech/**"
      - "codec/**"
      - "muxer/**"
      - "demuxer/**"
      - "network/**"
      - "transport/**"
      - "recognition/**"
      - "media/**"
      - "server/**"
      - "streamer/**"
      - "pipeline/**"
      - "webrtc/**"
      - "tests/**"
  push:
    branches: [master]
    paths:
      - ".github/workflows/server-released-sdk.yml"
      - "CMakeLists.txt"
      - "cmake/**"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
      - "vcpkg-overlays/**"
      - "common/**"
      - "core/**"
      - "crypto/**"
      - "speech/**"
      - "codec/**"
      - "muxer/**"
      - "demuxer/**"
      - "network/**"
      - "transport/**"
      - "recognition/**"
      - "media/**"
      - "server/**"
      - "streamer/**"
      - "pipeline/**"
      - "webrtc/**"
      - "tests/**"

permissions:
  contents: read
  packages: read

concurrency:
  group: server-released-sdk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-server:
    name: Linux SERVER released-SDK contract
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read

      - uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@master

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Prepare build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config nasm

      - name: Restore released server SDKs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/turbomedia-linux-server.config"
          project="$RUNNER_TEMP/turbomedia-linux-server.csproj"
          packages="$RUNNER_TEMP/turbomedia-linux-server-packages"
          printf '<configuration><packageSources><clear /></packageSources></configuration>\n' > "$config"
          dotnet nuget add source https://nuget.pkg.github.com/qigao/index.json \
            --name github --username qigao --password "$GITHUB_TOKEN" \
            --store-password-in-clear-text --configfile "$config"
          cat > "$project" <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><TargetFramework>net8.0</TargetFramework></PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Salts.Native" Version="*" />
              <PackageReference Include="SaltsUtils.Native" Version="*" />
              <PackageReference Include="SaltsNet.Native" Version="*" />
              <PackageReference Include="CHttp.Native" Version="*" />
              <PackageReference Include="RulesForge.Native" Version="*" />
              <PackageReference Include="TurboDB.Native" Version="*" />
            </ItemGroup>
          </Project>
          EOF
          dotnet restore "$project" --configfile "$config" --packages "$packages"

          resolve_sdk_root() {
            local package_id="$1"
            local package_root="$packages/$package_id"
            local matches=()
            mapfile -t matches < <(find "$package_root" -mindepth 1 -maxdepth 1 -type d -print)
            if [ "${#matches[@]}" -ne 1 ]; then
              printf 'expected exactly one restored version for %s, found %s\n' \
                "$package_id" "${#matches[@]}" >&2
              return 1
            fi
            printf '%s/sdk/linux-x64\n' "${matches[0]}"
          }

          echo "SALTS_ROOT=$(resolve_sdk_root salts.native)" >> "$GITHUB_ENV"
          echo "SALTS_UTILS_ROOT=$(resolve_sdk_root saltsutils.native)" >> "$GITHUB_ENV"
          echo "SALTSNET_ROOT=$(resolve_sdk_root saltsnet.native)" >> "$GITHUB_ENV"
          echo "CHTTP_ROOT=$(resolve_sdk_root chttp.native)" >> "$GITHUB_ENV"
          echo "RULES_FORGE_ROOT=$(resolve_sdk_root rulesforge.native)" >> "$GITHUB_ENV"
          echo "TURBODB_ROOT=$(resolve_sdk_root turbodb.native)" >> "$GITHUB_ENV"

      - name: Verify released SDK contracts
        shell: bash
        run: |
          set -euo pipefail
          test -f "$SALTS_ROOT/lib/cmake/Salts/SaltsConfig.cmake"
          test -f "$SALTS_UTILS_ROOT/lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake"
          test -f "$SALTSNET_ROOT/lib/cmake/SaltsNet/SaltsNetConfig.cmake"
          test -f "$CHTTP_ROOT/lib/cmake/Chttp/ChttpConfig.cmake"
          test -f "$RULES_FORGE_ROOT/lib/cmake/RulesForge/RulesForgeConfig.cmake"
          test -f "$TURBODB_ROOT/lib/cmake/Orm/OrmConfig.cmake"
          test -f "$TURBODB_ROOT/include/shared/orm/orm_runtime.h"
          test -f "$TURBODB_ROOT/include/shared/orm/orm.h"
          test ! -f "$TURBODB_ROOT/lib/cmake/OrmPostgreSQL/OrmPostgreSQLConfig.cmake"

      - name: Restore TurboMedia vcpkg dependencies cache-only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf vcpkg_installed
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root=. \
            --x-install-root="$GITHUB_WORKSPACE/vcpkg_installed" \
            --triplet x64-linux \
            --only-binarycaching

      - name: Configure Linux SERVER
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/linux-server-sdk stage/linux-server
          cmake -S . -B build/linux-server-sdk -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTURBO_MEDIA_PRODUCT=SERVER \
            -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_MANIFEST_MODE=OFF \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed" \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/stage/linux-server"

      - name: Build and test Linux SERVER
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$RULES_FORGE_ROOT/lib:$TURBODB_ROOT/lib:$SALTSNET_ROOT/lib:$CHTTP_ROOT/lib:$SALTS_UTILS_ROOT/lib:$SALTS_ROOT/lib:$GITHUB_WORKSPACE/vcpkg_installed/x64-linux/lib:${LD_LIBRARY_PATH:-}"
          cmake --build build/linux-server-sdk --parallel 2
          ctest --test-dir build/linux-server-sdk --no-tests=error --output-on-failure

      - name: Install Linux SERVER
        shell: bash
        run: |
          set -euo pipefail
          cmake --install build/linux-server-sdk
          config="$GITHUB_WORKSPACE/stage/linux-server/lib/cmake/TurboMedia/TurboMediaConfig.cmake"
          test -f "$config"
          grep -F 'set(TurboMedia_PRODUCT "SERVER")' "$config"
          test ! -e "$GITHUB_WORKSPACE/stage/linux-server/include/salts_capture.h"
          test ! -e "$GITHUB_WORKSPACE/stage/linux-server/include/salts_playback.h"

      - name: Build fresh installed-package consumer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/linux-server-consumer
          cmake -S tests/package_consumer -B build/linux-server-consumer -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTurboMedia_EXPECTED_PRODUCT=SERVER \
            -DTurboMedia_DIR="$GITHUB_WORKSPACE/stage/linux-server/lib/cmake/TurboMedia" \
            -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_MANIFEST_MODE=OFF \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed"
          cmake --build build/linux-server-consumer --parallel 2
