name: StreamGraph architecture diagrams

on:
  push:
    paths:
      - 'docs/design/streamgraph-v2-*.md'
      - '.github/workflows/streamgraph-diagrams.yml'
  pull_request:
    paths:
      - 'docs/design/streamgraph-v2-*.md'
      - '.github/workflows/streamgraph-diagrams.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mermaid:
    name: Parse StreamGraph Mermaid
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Parse Mermaid diagrams in design contracts
        uses: sgerrand/mermaid-validation-action@31f8eed257dbbbadad3332c83694866903e92b0e # v0.2.0
        id: validate
        with:
          files: |
            docs/design/streamgraph-v2-architecture.md
            docs/design/streamgraph-v2-ownership-conformance.md
          fail-on-warning: 'true'
          comment-on-pr: 'false'
      - name: Require architecture and lifecycle coverage
        env:
          DIAGRAMS: ${{ steps.validate.outputs.block-count }}
        run: |
          echo "StreamGraph diagrams parsed: ${DIAGRAMS}"
          test "${DIAGRAMS}" -ge 5
