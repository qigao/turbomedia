name: Windows media binary cache

'on':
  pull_request:
    paths:
      - '.github/workflows/windows-media-cache.yml'
      - 'docs/ci/windows-media-cache.md'
      - 'cmake/ci/**'
      - '.github/actions/setup-native-deps/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-media-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  produce:
    name: Produce and independently restore x64-windows media
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2022
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    env:
      X_VCPKG_NUGET_ID_PREFIX: turbomedia-media
      TM_RECIPE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TM_RECIPE_SHA }}
          persist-credentials: false

      - uses: ./.github/actions/setup-native-deps
        with:
          re2c: 'false'

      - name: Prepare the same Windows tools as Platform Build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install ninja nasm strawberryperl ccache -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Windows build tool installation failed' }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($vs)) {
            throw 'x64 MSVC was not found'
          }
          $canonicalVcpkgRoot = $env:VCPKG_ROOT
          $vsdev = Join-Path $vs 'Common7/Tools/VsDevCmd.bat'
          $command = 'call "' + $vsdev + '" -arch=x64 -host_arch=x64 >nul && set'
          $lines = & cmd.exe /d /s /c $command
          if ($LASTEXITCODE -ne 0) { throw 'VsDevCmd failed' }
          foreach ($line in $lines) {
            if ($line -match '^([^=]+)=(.*)$') {
              "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }
          "VCPKG_ROOT=$canonicalVcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Attest recipe and locked toolchain identities
        id: contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (& git rev-parse HEAD | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -cne $env:TM_RECIPE_SHA) {
            throw 'Producer did not check out the exact recipe source'
          }
          $lock = Get-Content cmake/ci/m16-sdk-lock.json -Raw | ConvertFrom-Json
          if ($env:VCPKG_SCRIPTS_REVISION -cne $lock.vcpkg_scripts_revision -or
              $env:VCPKG_TOOL_REVISION -cne $lock.vcpkg_tool_version) {
            throw 'Producer tool/scripts identity differs from Platform Build lock'
          }
          $manifest = Get-Content vcpkg.json -Raw | ConvertFrom-Json
          if ($manifest.'builtin-baseline' -cne $lock.vcpkg_baseline) {
            throw 'Product vcpkg baseline differs from the lock'
          }
          $compiler = (Get-Command cl.exe -ErrorAction Stop).Source
          $compilerHash = (Get-FileHash $compiler -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Recipe=$actual ImageVersion=$env:ImageVersion"
          Write-Host "MSVC=$env:VCToolsVersion SDK=$env:WindowsSDKVersion cl_sha256=$compilerHash"
          Write-Host "vcpkg_scripts=$env:VCPKG_SCRIPTS_REVISION vcpkg_tool=$env:VCPKG_TOOL_REVISION contract=$env:VCPKG_CACHE_REVISION"
          Add-Content $env:GITHUB_OUTPUT "image=$env:ImageVersion"

      - name: Verify actual NuGet upload authentication with loopback fake credentials
        shell: pwsh
        run: |
          python cmake/ci/verify_nuget_upload.py
          if ($LASTEXITCODE -ne 0) { throw 'NuGet upload authentication transport failed' }

      - name: Produce the product media ABI closure (${{ steps.contract.outputs.image }})
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python cmake/ci/github_packages.py media --triplet x64-windows --installed "$env:RUNNER_TEMP/turbomedia-windows-produced" --produce
          if ($LASTEXITCODE -ne 0) { throw 'Windows media cache production/publication failed' }

      - name: Verify clean curl L2 restore with source builds forbidden (${{ steps.contract.outputs.image }})
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python cmake/ci/github_packages.py media --triplet x64-windows --installed "$env:RUNNER_TEMP/turbomedia-windows-clean"
          if ($LASTEXITCODE -ne 0) { throw 'Clean central L2 cache-only restore failed' }
          Add-Content $env:GITHUB_STEP_SUMMARY "Recipe: $env:TM_RECIPE_SHA"
          Add-Content $env:GITHUB_STEP_SUMMARY "Runner image: $env:ImageVersion; triplet: x64-windows"
          Add-Content $env:GITHUB_STEP_SUMMARY 'Media packages downloaded with curl and restored with an empty L1 cache and --only-binarycaching.'
