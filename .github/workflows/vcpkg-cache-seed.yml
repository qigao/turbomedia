name: TurboMedia vcpkg Cache Seed

on:
  pull_request:
    paths:
      - ".github/workflows/vcpkg-cache-seed.yml"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
      - "vcpkg-overlays/**"
  push:
    branches: [master]
    paths:
      - ".github/workflows/vcpkg-cache-seed.yml"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
      - "vcpkg-overlays/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: turbomedia-vcpkg-seed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Seed Linux x64 ABI set
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: readwrite

      - name: Prepare product dependency build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config nasm autoconf automake libtool

      - name: Build missing TurboMedia ABI packages and publish cache entries
        shell: bash
        run: |
          set -euo pipefail
          rm -rf vcpkg_installed
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root=. \
            --x-install-root="$GITHUB_WORKSPACE/vcpkg_installed" \
            --triplet x64-linux

      - name: Verify product ABI set is now cache-only restorable
        shell: bash
        run: |
          set -euo pipefail
          rm -rf vcpkg_installed
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root=. \
            --x-install-root="$GITHUB_WORKSPACE/vcpkg_installed" \
            --triplet x64-linux \
            --only-binarycaching
