name: StreamGraph instrumented FFmpeg in-send cancellation

'on':
  push:
    paths:
      - 'streamgraph/adapters/ffmpeg/**'
      - 'streamgraph/CMakeLists.txt'
      - 'streamgraph/tests/installed_salts/**'
      - '.github/workflows/streamgraph-ffmpeg-internal-cancel.yml'
  pull_request:
    paths:
      - 'streamgraph/adapters/ffmpeg/**'
      - 'streamgraph/CMakeLists.txt'
      - 'streamgraph/tests/installed_salts/**'
      - '.github/workflows/streamgraph-ffmpeg-internal-cancel.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ffmpeg-inside-send-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  real-libavcodec-gate:
    name: Actual libavcodec function body cancellation (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install minimal native build tools (no prebuilt Codec SDK)
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential pkg-config ninja-build ccache
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: linux-ffmpeg-6.1.1-insend-${{ hashFiles('streamgraph/adapters/ffmpeg/tests/instrumented/patch_ffmpeg_send.py') }}
      - name: Build exact pinned FFmpeg 6.1.1 with gate INSIDE avcodec_send_packet
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/ffmpeg-exact-src"
          prefix="$RUNNER_TEMP/ffmpeg-instrumented"
          # Annotated tag n6.1.1 resolves to this immutable release commit.
          expected=e38092ef9395d7049f871ef4d5411eb410e283e0
          git clone --depth 1 --branch n6.1.1 https://github.com/FFmpeg/FFmpeg "$source_dir"
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$expected"
          python3 streamgraph/adapters/ffmpeg/tests/instrumented/patch_ffmpeg_send.py \
            "$source_dir/libavcodec/decode.c"
          (
            cd "$source_dir"
            ./configure \
              --prefix="$prefix" --libdir="$prefix/lib" \
              --cc='ccache gcc' --disable-autodetect --disable-asm \
              --disable-everything --enable-shared --disable-static \
              --disable-programs --disable-doc --disable-network \
              --disable-avdevice --disable-avfilter --disable-avformat \
              --disable-postproc --disable-swresample --disable-swscale \
              --enable-avcodec --enable-avutil --enable-pthreads \
              --enable-decoder=mjpeg --enable-encoder=mjpeg \
              --enable-decoder=mpeg2video --enable-encoder=mpeg2video
            make -j4
            make install
          )
          test -f "$prefix/lib/pkgconfig/libavcodec.pc"
          nm -D --defined-only "$prefix/lib/libavcodec.so" | grep -q avcodec_tm_test_arm_send_packet
          echo "TM_FF_INSTRUMENTED_PREFIX=$prefix" >> "$GITHUB_ENV"
          echo "FFmpeg commit: $expected, deliberately patched test-only libavcodec" >> "$GITHUB_STEP_SUMMARY"
      - name: Compile and repeat the real in-function cancellation gate
        shell: bash
        run: |
          set -euo pipefail
          export PKG_CONFIG_PATH="$TM_FF_INSTRUMENTED_PREFIX/lib/pkgconfig"
          export LD_LIBRARY_PATH="$TM_FF_INSTRUMENTED_PREFIX/lib:${LD_LIBRARY_PATH:-}"
          pkg-config --modversion libavcodec libavutil
          test "$(pkg-config --variable=prefix libavcodec)" = "$TM_FF_INSTRUMENTED_PREFIX"
          cmake -S streamgraph -B "$RUNNER_TEMP/sg-ffmpeg-instrumented" -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DBUILD_TESTING=ON \
            -DTM_STREAMGRAPH_ENABLE_FFMPEG_PROVIDER=ON \
            -DTM_STREAMGRAPH_FFMPEG_INSTRUMENTED_CONFORMANCE=ON
          cmake --build "$RUNNER_TEMP/sg-ffmpeg-instrumented" \
            --target streamgraph_ffmpeg_instrumented_cancel_test
          binary="$RUNNER_TEMP/sg-ffmpeg-instrumented/streamgraph_ffmpeg_instrumented_cancel_test"
          ldd "$binary" | tee "$RUNNER_TEMP/instrumented-linked.txt"
          grep -F "$TM_FF_INSTRUMENTED_PREFIX/lib/libavcodec.so" "$RUNNER_TEMP/instrumented-linked.txt"
          ctest --test-dir "$RUNNER_TEMP/sg-ffmpeg-instrumented" \
            -R '^streamgraph_ffmpeg_instrumented_cancel$' \
            --repeat until-fail:10 --no-tests=error --output-on-failure --timeout 60
          echo "10/10 in-libavcodec cancellation gate runs, pinned FFmpeg 6.1.1" >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch and verify immutable Salts.Native candidate for real DSO gate
        shell: bash
        run: |
          set -euo pipefail
          version=2.3.0-rc.14
          release_sha=c8a1a3d5e259a89ad42e75f1e4c3142e6b106ee1
          filename="Salts.Native.$version.nupkg"
          base="https://github.com/qigao/salts/releases/download/v$version"
          curl --retry 8 --retry-all-errors --retry-delay 5 -fLsS "$base/$filename" -o "$RUNNER_TEMP/$filename"
          curl --retry 8 --retry-all-errors --retry-delay 5 -fLsS "$base/SHA256SUMS" -o "$RUNNER_TEMP/SHA256SUMS"
          python3 - "$RUNNER_TEMP/$filename" "$RUNNER_TEMP/SHA256SUMS" "$RUNNER_TEMP/salts-exact" \
                    linux-x64 "$release_sha" "$version" <<'PY'
          import hashlib, pathlib, sys, zipfile
          pkg, check, root, rid, commit, version = sys.argv[1:]
          digest = hashlib.sha256(pathlib.Path(pkg).read_bytes()).hexdigest()
          sums = pathlib.Path(check).read_text().splitlines()
          assert len(sums)==1 and sums[0].split()[0].lower()==digest, "wrong SDK checksum"
          with zipfile.ZipFile(pkg) as z:
              manifest=f'sdk/{rid}/salts-sdk-manifest.txt'
              assert manifest in z.namelist(), "SDK missing expected RID"
              fields=dict(row.split('=',1) for row in
                          z.read(manifest).decode('utf-8-sig').splitlines() if '=' in row)
              assert fields['commit']==commit and fields['version']==version
              assert fields['profile']=='release', "wrong SDK build profile"
              assert f'sdk/{rid}/include/salts/component_plugin.h' in z.namelist()
              z.extractall(root,[m for m in z.infolist() if m.filename.startswith(f'sdk/{rid}/')])
          print(f"Salts SDK exact pin: {commit}, sha256={digest}")
          PY
          echo "TM_SALTS_SDK_ROOT=$RUNNER_TEMP/salts-exact/sdk/linux-x64" >> "$GITHUB_ENV"
      - name: Build independently installed StreamGraph FFmpeg SDK against instrumented Codec
        shell: bash
        run: |
          set -euo pipefail
          export PKG_CONFIG_PATH="$TM_FF_INSTRUMENTED_PREFIX/lib/pkgconfig"
          export LD_LIBRARY_PATH="$TM_FF_INSTRUMENTED_PREFIX/lib:${LD_LIBRARY_PATH:-}"
          cmake -S streamgraph -B "$RUNNER_TEMP/sg-installed-instrumented-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DTM_STREAMGRAPH_ENABLE_FFMPEG_PROVIDER=ON
          cmake --build "$RUNNER_TEMP/sg-installed-instrumented-build" \
            --target turbo_media_streamgraph_ffmpeg
          cmake --install "$RUNNER_TEMP/sg-installed-instrumented-build" \
            --prefix "$RUNNER_TEMP/sg-instrumented-sdk"
          test -f "$RUNNER_TEMP/sg-instrumented-sdk/lib/cmake/TurboMediaStreamGraphFFmpeg/TurboMediaStreamGraphFFmpegConfig.cmake"
          echo "TM_SG_SDK_ROOT=$RUNNER_TEMP/sg-instrumented-sdk" >> "$GITHUB_ENV"
      - name: Real Salts ComponentPlugin Generation Scope while inside libavcodec
        shell: bash
        env:
          TM_TEST_FFMPEG_DSO: '1'
          TM_TEST_FFMPEG_INNER_GATE: '1'
        run: |
          set -euo pipefail
          export PKG_CONFIG_PATH="$TM_FF_INSTRUMENTED_PREFIX/lib/pkgconfig"
          export PATH="$TM_SALTS_SDK_ROOT/bin:$TM_SG_SDK_ROOT/bin:$PATH"
          export LD_LIBRARY_PATH="$TM_FF_INSTRUMENTED_PREFIX/lib:$TM_SALTS_SDK_ROOT/lib:$TM_SG_SDK_ROOT/lib:${LD_LIBRARY_PATH:-}"
          cmake -S streamgraph/tests/installed_salts \
            -B "$RUNNER_TEMP/sg-salts-inside-codec" -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_FIND_USE_PACKAGE_REGISTRY=FALSE \
            -DCMAKE_FIND_USE_SYSTEM_PACKAGE_REGISTRY=FALSE
          cmake --build "$RUNNER_TEMP/sg-salts-inside-codec"
          ldd "$RUNNER_TEMP/sg-salts-inside-codec/tm_installed_salts_generation_test" \
            | tee "$RUNNER_TEMP/salts-inside-linked.txt"
          grep -F "$TM_FF_INSTRUMENTED_PREFIX/lib/libavcodec.so" "$RUNNER_TEMP/salts-inside-linked.txt"
          ctest --test-dir "$RUNNER_TEMP/sg-salts-inside-codec" \
            -R '^installed_salts_component_plugin_dso$' \
            --repeat until-fail:10 --no-tests=error --output-on-failure --timeout 90
          echo "10/10 actual Salts ComponentPlugin DSO + instrumented libavcodec gate" >> "$GITHUB_STEP_SUMMARY"
