name: Set up native dependency transport
description: Bootstrap the locked vcpkg contract and restore host code generators with curl.
inputs:
  re2c:
    description: Restore the locked re2c and Lemon host tools
    default: 'true'
runs:
  using: composite
  steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: qigao/vcpkg-cache
        ref: d4afc8cd2f5ed3585c1e26469e379a087ce9ecf3
        path: build/ci-vcpkg-infrastructure
        persist-credentials: false
    - name: Bootstrap locked vcpkg without managed package clients
      shell: bash
      run: |
        python -m unittest discover -s cmake/ci -p 'test_github_packages.py'
        python cmake/ci/setup_vcpkg.py build/ci-vcpkg-infrastructure
    - name: Download re2c from GitHub Packages with curl
      if: inputs.re2c == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: python cmake/ci/github_packages.py re2c
    - name: Select the Lemon host package
      id: lemon-host
      if: inputs.re2c == 'true'
      shell: bash
      run: |
        host="$(printf '%s-%s' "$RUNNER_OS" "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')"
        executable=lemon
        if [ "$RUNNER_OS" = Windows ]; then
          executable=lemon.exe
        fi
        printf 'payload=tools/%s\nexecutable=bin/%s\n' "$host" "$executable" >> "$GITHUB_OUTPUT"
    - uses: qigao/vcpkg-cache/.github/actions/setup-native-dependency@46980b67893391cd4e43d193d00c14631adc7372
      if: inputs.re2c == 'true'
      with:
        package-id: Qigao.Lemon.Binary
        version: 1.0.0
        sha256: 92539e4d99c38657fa69f0bdaea73be2b35f6572cb6a9264731ae58a6da073cd
        destination: ${{ runner.temp }}/turbomedia-lemon
        payload: ${{ steps.lemon-host.outputs.payload }}
        required-files: share/lemon/lempar.c
        executables: ${{ steps.lemon-host.outputs.executable }}
        env-prefix: LEMON
