name: Set up native dependency transport
description: Bootstrap the locked vcpkg contract and download re2c with curl; no Mono or .NET.
inputs:
  re2c:
    description: Download the locked re2c host tool
    default: 'true'
runs:
  using: composite
  steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: qigao/vcpkg-cache
        ref: d4afc8cd2f5ed3585c1e26469e379a087ce9ecf3
        path: build/ci-vcpkg-infrastructure
        persist-credentials: false
    - name: Bootstrap locked vcpkg without managed package clients
      shell: bash
      run: |
        python -m unittest discover -s cmake/ci -p 'test_github_packages.py'
        python cmake/ci/setup_vcpkg.py build/ci-vcpkg-infrastructure
    - name: Download re2c from GitHub Packages with curl
      if: inputs.re2c == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: python cmake/ci/github_packages.py re2c
